<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>소설 취향 테스트 — 취향과 내공으로 찾는 나의 책</title>
<meta name="description" content="여덟 개의 기분으로 취향을, 다섯 개의 습관으로 독서 내공을 재어, 당신 수준에 꼭 맞는 책을 권합니다." />
<meta property="og:title" content="소설 취향 테스트" />
<meta property="og:description" content="당신은 어떤 이야기에 마음이 열릴까요? 취향과 내공, 두 축으로 찾는 나의 다음 책." />
<meta property="og:type" content="website" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap');

*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }

:root{
  --bg:#181425; --card:#211c30; --edge:#332b47;
  --ink:#F2E9D6; --muted:#A79CB6; --accent:#E3A24A;
}
body{
  min-height:100vh; position:relative; overflow-x:hidden;
  background:
    radial-gradient(1200px 600px at 50% -10%, #241d38 0%, transparent 60%),
    var(--bg);
  color:var(--ink);
  font-family:'Noto Sans KR', system-ui, -apple-system, sans-serif;
  display:flex; flex-direction:column; align-items:center;
  padding:28px 18px calc(40px + env(safe-area-inset-bottom));
}
#glow{
  position:fixed; inset:0; pointer-events:none; z-index:0;
  background:radial-gradient(520px 520px at 50% 34%, color-mix(in srgb, var(--accent) 22%, transparent) 0%, transparent 70%);
  animation:breathe 7s ease-in-out infinite; transition:background .8s ease;
}
@keyframes breathe{0%,100%{opacity:.6}50%{opacity:1}}

#shell{ position:relative; z-index:1; width:100%; max-width:600px; }

.card{
  background:linear-gradient(180deg, color-mix(in srgb,var(--card) 96%, #fff 4%), var(--card));
  border:1px solid var(--edge);
  border-radius:22px;
  padding:34px 30px;
  box-shadow:0 30px 70px -30px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.03);
}

.eyebrow{ font-size:12.5px; letter-spacing:.32em; text-transform:uppercase; color:var(--accent); margin:0 0 20px; font-weight:500; }
.title{ font-family:'Gowun Batang', serif; font-weight:700; font-size:clamp(30px,7.5vw,42px); line-height:1.24; margin:0 0 20px; letter-spacing:-.01em; }
.lead{ color:var(--muted); line-height:1.75; font-size:15.5px; margin:0 0 20px; }
.chips{ display:flex; gap:8px; flex-wrap:wrap; margin:0 0 30px; }
.chip{ font-size:12.5px; color:var(--muted); border:1px solid var(--edge); border-radius:99px; padding:6px 12px; }
.chip b{ color:var(--accent); font-weight:700; }

.btn{ appearance:none; border:none; cursor:pointer; width:100%; font-family:'Noto Sans KR',sans-serif; font-weight:700; font-size:16px; padding:16px 20px; border-radius:14px; transition:transform .15s ease, filter .2s ease; background:var(--accent); color:#1c1206; }
.btn:hover{ transform:translateY(-2px); filter:brightness(1.05); }
.btn:active{ transform:translateY(0); }
.note{ text-align:center; color:var(--muted); font-size:12.5px; margin:14px 0 0; }

.progrow{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
.back{ background:none; border:none; color:var(--muted); cursor:pointer; font-family:inherit; font-size:13px; padding:4px 2px; }
.back:hover{ color:var(--ink); }
.count{ font-size:13px; color:var(--muted); letter-spacing:.02em; }
.count b{ color:var(--accent); font-weight:700; }
.phase{ font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); margin:0 0 12px; }
.bar{ height:4px; border-radius:99px; background:#2c2540; overflow:hidden; margin-bottom:28px; }
.bar span{ display:block; height:100%; background:linear-gradient(90deg,#E3A24A,#d98450); border-radius:99px; transition:width .45s cubic-bezier(.5,.1,.2,1); }

.q{ font-family:'Gowun Batang', serif; font-weight:700; font-size:clamp(21px,4.6vw,26px); line-height:1.5; margin:0 0 24px; letter-spacing:-.01em; }

.opts{ display:flex; flex-direction:column; gap:11px; }
.opt{ text-align:left; cursor:pointer; width:100%; background:#1c1830; border:1px solid var(--edge); border-radius:14px; color:var(--ink); font-family:inherit; font-size:15px; line-height:1.5; padding:16px 18px; transition:border-color .18s, background .18s, transform .12s; opacity:0; animation:rise .5s ease forwards; }
.opt:hover{ border-color:var(--accent); background:#241d38; transform:translateX(3px); }
.opt:active{ transform:translateX(0) scale(.995); }

@keyframes rise{ from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)} }
.fade{ animation:fadecard .5s ease both; }
@keyframes fadecard{ from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:translateY(0)} }

.rtop{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 0 4px; }
.rtag{ font-size:13px; letter-spacing:.06em; color:var(--muted); margin:0; }
.badge{ font-size:12px; font-weight:700; letter-spacing:.02em; white-space:nowrap; border-radius:99px; padding:6px 12px; background:color-mix(in srgb, var(--accent) 16%, transparent); border:1px solid color-mix(in srgb, var(--accent) 45%, transparent); color:var(--accent); }
.rname{ font-family:'Gowun Batang', serif; font-weight:700; font-size:clamp(30px,7.5vw,40px); line-height:1.2; margin:6px 0 20px; color:var(--accent); }
.rblurb{ line-height:1.78; font-size:16px; margin:0 0 24px; }
.why{ background:#1b1730; border:1px solid var(--edge); border-radius:14px; padding:16px 18px; margin:0 0 18px; }
.why-lbl{ display:block; font-size:12px; letter-spacing:.14em; text-transform:uppercase; font-weight:700; margin-bottom:7px; color:var(--accent); }
.why p{ margin:0; color:var(--muted); line-height:1.7; font-size:14.5px; }
.mix{ font-size:14px; color:var(--muted); margin:0 0 28px; }
.mix b{ font-weight:700; }

.shelf-head{ display:flex; align-items:center; gap:12px; margin-bottom:14px; }
.shelf-head h3{ font-family:'Gowun Batang',serif; font-size:19px; margin:0; font-weight:700; }
.arrow{ flex:1; height:2px; border-radius:2px; opacity:.5; background:var(--accent); }

.tabs{ display:flex; gap:8px; margin:0 0 6px; }
.tab{ flex:1; cursor:pointer; font-family:inherit; font-size:13px; font-weight:700; padding:10px 6px; border-radius:11px; text-align:center; line-height:1.3; background:#1c1830; border:1px solid var(--edge); color:var(--muted); transition:all .16s; }
.tab small{ display:block; font-weight:500; font-size:10.5px; opacity:.8; margin-top:2px; }
.tab:hover{ color:var(--ink); }
.tab.on{ color:var(--accent); border-color:color-mix(in srgb, var(--accent) 55%, transparent); background:color-mix(in srgb, var(--accent) 12%, transparent); }
.tab .you{ font-size:9px; letter-spacing:.05em; }

.tiercap{ font-size:12.5px; color:var(--muted); margin:14px 0 12px; line-height:1.6; }
.tiercap b{ color:var(--ink); font-weight:700; }

.book{ display:flex; gap:14px; padding:15px 0; border-top:1px solid var(--edge); }
.book:first-of-type{ border-top:none; }
.book-num{ font-family:'Gowun Batang',serif; font-weight:700; font-size:13px; color:var(--muted); min-width:44px; padding-top:2px; letter-spacing:.02em; }
.book-title{ margin:0 0 4px; font-size:16px; font-weight:700; line-height:1.4; }
.book-author{ font-weight:400; color:var(--muted); font-size:14px; }
.book-reason{ margin:0; color:var(--muted); line-height:1.6; font-size:14px; }
.book-gate{ background:color-mix(in srgb, var(--accent) 12%, transparent); border:1px solid color-mix(in srgb, var(--accent) 40%, transparent); border-radius:14px; padding:15px 16px; margin-bottom:4px; }
.book-gate + .book{ border-top:none; }

.share{ display:flex; gap:10px; margin:24px 0 8px; }
.share .btn{ flex:1; }
.btn-ghost{ background:transparent; color:var(--ink); border:1px solid var(--edge); font-weight:500; }
.btn-ghost:hover{ filter:none; background:#241d38; }

.disc{ font-size:11.5px; color:#7a6f8c; line-height:1.6; margin:18px 0 0; }
.foot{ position:relative; z-index:1; margin-top:26px; color:#6f647f; font-size:12px; letter-spacing:.04em; text-align:center; }

@media (max-width:420px){ .card{ padding:28px 22px; } }
@media (prefers-reduced-motion: reduce){
  #glow{ animation:none; }
  .opt, .fade{ animation:none !important; opacity:1 !important; transform:none !important; }
  .btn:hover, .opt:hover{ transform:none; }
}
</style>
</head>
<body>
<div id="glow"></div>
<main id="shell"></main>
<footer class="foot">취향으로 방향을, 내공으로 깊이를 · 나에게 맞는 다음 책</footer>

<script>

const shell = document.getElementById("shell");

let step = 0, scores = {}, levelScore = 0, selectedLevel = 1;
function resetState(){ scores = {}; ORDER.forEach(k=>scores[k]=0); levelScore = 0; step = 0; }

function esc(s){ return String(s).replace(/[&<>"]/g, c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])); }
function setAccent(hex){ document.documentElement.style.setProperty("--accent", hex); }
function levelFromScore(v){ return v<=4 ? 1 : (v<=9 ? 2 : 3); }

/* ================= 인트로 ================= */
function renderIntro(){

    </section>`;
  document.getElementById("start").onclick = ()=>{ step=0; renderStep(); };
}

/* ================= 문항 ================= */
function renderStep(){
  const isTaste = step < TASTE_Q.length;
  const data = isTaste ? TASTE_Q[step] : LEVEL_Q[step - TASTE_Q.length];
  const pct = Math.round((step/total)*100);
  const phase = isTaste
    ? `취향 · ${step+1} / ${TASTE_Q.length}`
    : `내공 · ${step - TASTE_Q.length + 1} / ${LEVEL_Q.length}`;

  const opts = data.o.map((pair,i)=>
    `<button class="opt" data-i="${i}" style="animation-delay:${0.05 + i*0.05}s"><span>${esc(pair[0])}</span></button>`
  ).join("");

  shell.innerHTML = `
    <section class="card fade">
      <div class="progrow">
        <button class="back" id="back">${step===0 ? "‹ 처음" : "‹ 이전"}</button>
        <span class="count">${esc(phase)}</span>
      </div>
      <p class="phase">${isTaste ? "무엇을 좋아하나요" : "얼마나 즐겨 읽나요"}</p>
      <div class="bar" role="progressbar" aria-valuenow="${pct}" aria-valuemin="0" aria-valuemax="100"><span style="width:${pct}%"></span></div>
      <h2 class="q">${esc(data.q)}</h2>
      <div class="opts">${opts}</div>
    </section>`;

  document.getElementById("back").onclick = ()=>{ if(step===0){ renderIntro(); } else { step--; renderStep(); } };

  shell.querySelectorAll(".opt").forEach(btn=>{
    btn.onclick = ()=>{
      const i = +btn.dataset.i;
      if(isTaste){ data.o[i][1].forEach(([k,w])=> scores[k]+=w); }
      else{ levelScore += data.o[i][1]; }
      if(step+1 < total){ step++; renderStep(); } else { renderResult(); }
    };
  });
}

/* ================= 결과 ================= */
function renderResult(){
  const ranked = [...ORDER].sort((a,b)=> scores[b]-scores[a]);
  const win = ranked[0], second = ranked[1];
  const d = TYPES[win], s = TYPES[second];
  const measured = levelFromScore(levelScore);
  selectedLevel = measured;
  setAccent(d.accent);

  const tabs = [1,2,3].map(l=>{
    const on = l===selectedLevel ? " on" : "";
    const you = l===measured ? `<span class="you">· 나의 등급</span>` : "";
    return `<button class="tab${on}" data-l="${l}">${esc(LEVELS[l].short)} ${you}<small>${esc(LEVELS[l].key)}</small></button>`;
  }).join("");

  shell.innerHTML = `
    <section class="card fade">
      <div class="rtop">
        <p class="rtag">당신의 독서 취향</p>
        <span class="badge">내공 · ${esc(LEVELS[measured].name)}</span>
      </div>
      <h1 class="rname">${esc(d.name)}</h1>
      <p class="rblurb">${esc(d.blurb)}</p>
      <div class="why">
        <span class="why-lbl">왜 잘 맞을까요</span>
        <p>${esc(d.why)}</p>
      </div>
      <p class="mix">여기에 <b style="color:${s.accent}">${esc(s.tag)}</b>의 결도 살짝 섞여 있어요.</p>

      <div class="shelf-head"><h3>당신에게 맞는 책</h3><span class="arrow"></span></div>
      <div class="tabs">${tabs}</div>
      <div id="tierBox"></div>

      <div class="share">
        <button class="btn" id="shareBtn">결과 공유하기</button>
        <button class="btn btn-ghost" id="again">다시 해보기</button>
      </div>
      <p class="note" id="shareNote">친구에게도 취향과 내공을 물어보세요</p>
      <p class="disc">추천 도서는 실제 출간작 중에서 골랐으며, 내공 등급은 답변으로 가늠한 대략의 안내예요. 낮은 등급이 '못 읽는다'는 뜻은 아니고, 지금 가장 편히 즐길 결을 뜻해요. 다른 등급 책도 눌러서 둘러보세요.</p>
    </section>`;

  renderTier(win, measured);

  shell.querySelectorAll(".tab").forEach(t=>{
    t.onclick = ()=>{
      selectedLevel = +t.dataset.l;
      shell.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on", +x.dataset.l===selectedLevel));
      renderTier(win, measured);
    };
  });
  document.getElementById("again").onclick = renderIntro;
  document.getElementById("shareBtn").onclick = ()=> shareResult(d, measured);
}

function renderTier(typeKey, measured){
  const d = TYPES[typeKey];
  const lv = selectedLevel;
  const books = d.books[lv];
  const gate = LEVELS[lv].gate;
  const box = document.getElementById("tierBox");
  const badge = lv===measured ? "" : ` <span style="color:var(--muted);font-weight:400">(둘러보는 중)</span>`;
  const rows = books.map((b,i)=>{
    const [title,author,reason] = b;
    const isGate = i===0;
    const num = isGate ? gate : String(i+1).padStart(2,"0");
    return `
      <div class="book ${isGate?"book-gate":""}">
        <div class="book-num" ${isGate?`style="color:${d.accent}"`:""}>${esc(num)}</div>
        <div>
          <p class="book-title">${esc(title)} <span class="book-author">— ${esc(author)}</span></p>
          <p class="book-reason">${esc(reason)}</p>
        </div>
      </div>`;
  }).join("");
  box.innerHTML = `<p class="tiercap"><b>${esc(LEVELS[lv].name)}</b>${badge}<br>${esc(LEVELS[lv].cap)}</p>${rows}`;
}

/* ================= 공유 ================= */
async function shareResult(d, measured){
  const url = location.href.split("#")[0];
  const gate = d.books[measured][0][0];
  const text = `[소설 취향 테스트] 나는 '${d.name}' (${d.tag}) · 내공 ${LEVELS[measured].name}. 추천 첫 책은 「${gate}」!`;
  try{ if(navigator.share){ await navigator.share({ title:"소설 취향 테스트", text, url }); return; } }catch(e){}
  try{
    await navigator.clipboard.writeText(text + " " + url);
    const note = document.getElementById("shareNote");
    if(note) note.textContent = "결과를 복사했어요. 붙여넣어 공유하세요 ✓";
  }catch(e){
    const note = document.getElementById("shareNote");
    if(note) note.textContent = "이 환경에서는 공유가 지원되지 않아요";
  }
}

renderIntro();
</script>
</body>
</html>
