<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>소설 취향 테스트 — 취향과 내공으로 찾는 나의 책</title>
<meta name="description" content="여덟 개의 기분으로 취향을, 일곱 개의 습관으로 독서 내공을 5단계로 재어, 지금 당신에게 꼭 맞는 다섯 권을 권합니다." />
<meta property="og:title" content="소설 취향 테스트" />
<meta property="og:description" content="당신은 어떤 이야기에 마음이 열릴까요? 취향과 내공, 두 축으로 찾는 나의 다음 책." />
<meta property="og:type" content="website" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap');
*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }
:root{ --bg:#181425; --card:#211c30; --edge:#332b47; --ink:#F2E9D6; --muted:#A79CB6; --accent:#E3A24A; }
body{
  min-height:100vh; position:relative; overflow-x:hidden;
  background:radial-gradient(1200px 600px at 50% -10%, #241d38 0%, transparent 60%), var(--bg);
  color:var(--ink); font-family:'Noto Sans KR', system-ui, -apple-system, sans-serif;
  display:flex; flex-direction:column; align-items:center;
  padding:28px 18px calc(40px + env(safe-area-inset-bottom));
}
#glow{ position:fixed; inset:0; pointer-events:none; z-index:0;
  background:radial-gradient(520px 520px at 50% 34%, color-mix(in srgb, var(--accent) 22%, transparent) 0%, transparent 70%);
  animation:breathe 7s ease-in-out infinite; transition:background .8s ease; }
@keyframes breathe{0%,100%{opacity:.6}50%{opacity:1}}
#shell{ position:relative; z-index:1; width:100%; max-width:620px; }
.card{ background:linear-gradient(180deg, color-mix(in srgb,var(--card) 96%, #fff 4%), var(--card));
  border:1px solid var(--edge); border-radius:22px; padding:34px 30px;
  box-shadow:0 30px 70px -30px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.03); }
.eyebrow{ font-size:12.5px; letter-spacing:.32em; text-transform:uppercase; color:var(--accent); margin:0 0 20px; font-weight:500; }
.title{ font-family:'Gowun Batang', serif; font-weight:700; font-size:clamp(30px,7.5vw,42px); line-height:1.24; margin:0 0 20px; letter-spacing:-.01em; }
.lead{ color:var(--muted); line-height:1.78; font-size:15.5px; margin:0 0 18px; }
.chips{ display:flex; gap:8px; flex-wrap:wrap; margin:12px 0 30px; }
.chip{ font-size:12.5px; color:var(--muted); border:1px solid var(--edge); border-radius:99px; padding:6px 12px; }
.chip b{ color:var(--accent); font-weight:700; }
.btn{ appearance:none; border:none; cursor:pointer; width:100%; font-family:inherit; font-weight:700; font-size:16px;
  padding:16px 20px; border-radius:14px; transition:transform .15s, filter .2s; background:var(--accent); color:#1c1206; }
.btn:hover{ transform:translateY(-2px); filter:brightness(1.05); }
.btn:disabled{ opacity:.6; cursor:default; transform:none; }
.note{ text-align:center; color:var(--muted); font-size:12.5px; margin:14px 0 0; }
.progrow{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
.back{ background:none; border:none; color:var(--muted); cursor:pointer; font-family:inherit; font-size:13px; padding:4px 2px; }
.back:hover{ color:var(--ink); }
.count{ font-size:13px; color:var(--muted); }
.phase{ font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); margin:0 0 12px; }
.bar{ height:4px; border-radius:99px; background:#2c2540; overflow:hidden; margin-bottom:28px; }
.bar span{ display:block; height:100%; background:linear-gradient(90deg,#E3A24A,#d98450); border-radius:99px; transition:width .45s cubic-bezier(.5,.1,.2,1); }
.q{ font-family:'Gowun Batang', serif; font-weight:700; font-size:clamp(21px,4.6vw,26px); line-height:1.5; margin:0 0 24px; }
.opts{ display:flex; flex-direction:column; gap:11px; }
.opt{ text-align:left; cursor:pointer; width:100%; background:#1c1830; border:1px solid var(--edge); border-radius:14px;
  color:var(--ink); font-family:inherit; font-size:15px; line-height:1.5; padding:16px 18px;
  transition:border-color .18s, background .18s, transform .12s; opacity:0; animation:rise .5s ease forwards; }
.opt:hover{ border-color:var(--accent); background:#241d38; transform:translateX(3px); }
@keyframes rise{ from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)} }
.fade{ animation:fadecard .5s ease both; }
@keyframes fadecard{ from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:translateY(0)} }
.rtop{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 0 4px; flex-wrap:wrap; }
.rtag{ font-size:13px; letter-spacing:.06em; color:var(--muted); margin:0; }
.badge{ font-size:12px; font-weight:700; white-space:nowrap; border-radius:99px; padding:6px 12px;
  background:color-mix(in srgb, var(--accent) 16%, transparent); border:1px solid color-mix(in srgb, var(--accent) 45%, transparent); color:var(--accent); }
.rname{ font-family:'Gowun Batang', serif; font-weight:700; font-size:clamp(30px,7.5vw,40px); line-height:1.2; margin:8px 0 20px; color:var(--accent); }
.rblurb{ line-height:1.8; font-size:16px; margin:0 0 16px; }
.panel{ background:#1b1730; border:1px solid var(--edge); border-radius:14px; padding:17px 19px; margin:8px 0 14px; }
.panel-lbl{ display:block; font-size:12px; letter-spacing:.14em; text-transform:uppercase; font-weight:700; margin-bottom:8px; color:var(--accent); }
.panel p{ margin:0 0 10px; color:var(--muted); line-height:1.72; font-size:14.5px; }
.panel p:last-child{ margin-bottom:0; }
.mix{ font-size:14.5px; color:var(--muted); margin:16px 0 30px; line-height:1.7; }
.shelf-head{ display:flex; align-items:center; gap:12px; margin-bottom:6px; }
.shelf-head h3{ font-family:'Gowun Batang',serif; font-size:19px; margin:0; font-weight:700; }
.arrow{ flex:1; height:2px; border-radius:2px; opacity:.5; background:var(--accent); }
.tabhint{ font-size:12px; color:#7a6f8c; margin:0 0 12px; }
.tabs{ display:flex; gap:6px; overflow-x:auto; padding-bottom:6px; -webkit-overflow-scrolling:touch; scrollbar-width:none; }
.tabs::-webkit-scrollbar{ display:none; }
.tab{ flex:0 0 auto; min-width:92px; cursor:pointer; font-family:inherit; font-size:12.5px; font-weight:700;
  padding:9px 8px; border-radius:11px; text-align:center; line-height:1.3; background:#1c1830; border:1px solid var(--edge); color:var(--muted); transition:all .16s; }
.tab small{ display:block; font-weight:500; font-size:10px; opacity:.75; margin-top:3px; }
.tab.on{ color:var(--accent); border-color:color-mix(in srgb, var(--accent) 55%, transparent); background:color-mix(in srgb, var(--accent) 12%, transparent); }
.tab .you{ font-size:9px; }
.tiercap{ font-size:13px; color:var(--muted); margin:16px 0 8px; line-height:1.7; }
.tiercap b{ color:var(--ink); font-weight:700; }
.legend{ font-size:11.5px; color:#7a6f8c; margin:0 0 14px; }
.gem{ display:inline-block; font-size:10.5px; font-weight:700; letter-spacing:.02em; vertical-align:middle;
  padding:2px 7px; border-radius:99px; margin-left:6px; background:rgba(122,196,180,.14); border:1px solid rgba(122,196,180,.42); color:#7AC4B4; }
.book{ display:flex; gap:14px; padding:16px 0; border-top:1px solid var(--edge); }
.book:first-of-type{ border-top:none; }
.book-num{ font-family:'Gowun Batang',serif; font-weight:700; font-size:13px; color:var(--muted); min-width:46px; padding-top:3px; }
.book-title{ margin:0 0 5px; font-size:16px; font-weight:700; line-height:1.45; }
.book-author{ font-weight:400; color:var(--muted); font-size:14px; }
.book-reason{ margin:0; color:var(--muted); line-height:1.68; font-size:14px; }
.book-gate{ background:color-mix(in srgb, var(--accent) 12%, transparent);
  border:1px solid color-mix(in srgb, var(--accent) 40%, transparent); border-radius:14px; padding:16px; margin-bottom:4px; }
.book-gate + .book{ border-top:none; }
.share{ display:flex; gap:10px; margin:26px 0 0; }
.share .btn{ flex:1; }
.btn-ghost{ background:transparent; color:var(--ink); border:1px solid var(--edge); font-weight:500; }
.btn-ghost:hover{ filter:none; background:#241d38; }
.disc{ font-size:11.5px; color:#7a6f8c; line-height:1.65; margin:18px 0 0; }
.foot{ position:relative; z-index:1; margin-top:26px; color:#6f647f; font-size:12px; text-align:center; }
@media (max-width:420px){ .card{ padding:28px 22px; } }
@media (prefers-reduced-motion: reduce){ #glow{animation:none} .opt,.fade{animation:none!important;opacity:1!important;transform:none!important} .btn:hover,.opt:hover{transform:none} }
</style>
</head>
<body>
<div id="glow"></div>
<main id="shell"></main>
<footer class="foot">취향으로 방향을, 내공으로 깊이를 · 나에게 맞는 다음 책</footer>

<script>
/* ============ 내공 5단계 ============ */
const LEVELS={
1:{name:"첫 장을 여는 독자",short:"첫 발",key:"1단계",gate:"첫 책",
   cap:"아직 '완독의 즐거움'이 낯선 단계예요. 어려운 책보다 <b>끝까지 읽게 만드는 힘이 센 책</b>이 먼저입니다."},
2:{name:"재미를 붙인 독자",short:"입문+",key:"2단계",gate:"추천",
   cap:"몇 권 읽어본 덕에 두께에 대한 두려움이 줄어든 단계예요. <b>재미는 유지하되 조금 더 단단한 작품</b>이 어울립니다."},
3:{name:"제법 읽는 독자",short:"애독가",key:"3단계",gate:"추천",
   cap:"베스트셀러는 이미 웬만큼 읽어본 단계죠. 그래서 <b>널리 알려지진 않았지만 평이 단단한 작품</b>을 중심으로 골랐어요."},
4:{name:"깊이 읽는 독자",short:"숙련",key:"4단계",gate:"추천",
   cap:"문체와 구조까지 의식하며 읽는 단계예요. <b>대중적 인지도보다 작품성으로 평가받는 책</b>들을 모았습니다."},
5:{name:"끝까지 파고드는 독자",short:"탐험가",key:"5단계",gate:"도전작",
   cap:"쉬운 책으로는 갈증이 풀리지 않는 단계입니다. <b>문체·구조·주제 어느 하나가 확실히 까다로운</b> 작품들이에요."}
};
const LMAX=20;
function levelFromScore(v){ return v<=3?1 : v<=7?2 : v<=11?3 : v<=15?4 : 5; }

/* ============ 취향 유형 ============
   책 형식: [제목, 지은이, 이유, 숨은보석 여부] */
const TYPES={
thriller:{name:"밤을 새우는 추적자",tag:"스릴 · 반전",accent:"#D06A57",
 blurb:"당신을 움직이는 건 '그래서 어떻게 됐는데?'라는 물음이에요. 조여드는 긴장, 하나씩 맞춰지는 조각, 마지막의 뒤통수 한 방. 이 세 가지가 있으면 평소 책과 거리가 멀던 사람도 새벽 세 시까지 페이지를 넘기게 됩니다.",
 blurb2:"당신에게 소설은 '견디며 읽는 것'이 아니라 '멈추지 못해서 읽는 것'이에요. 그래서 오히려 독서 습관을 들이기 가장 유리한 취향이기도 합니다.",
 why:"이야기가 앞으로 굴러가는 추진력이 강한 장르라 집중이 흐트러질 틈이 없어요. 다음 장면이 궁금해서 저절로 손이 가니, 부담 대신 '조금만 더'라는 마음으로 완독하게 됩니다.",
 why2:"흩어진 단서가 마지막에 하나로 모이는 쾌감은 다른 장르가 쉽게 주지 못하는 보상이에요. 완독 후의 성취감이 뚜렷한 것도 큰 장점입니다.",
 books:{
1:[["용의자 X의 헌신","히가시노 게이고","범인을 처음부터 알려주는데도 긴장이 풀리지 않습니다. 문장이 짧고 명료해 속도가 붙고, 마지막 20쪽에서 사건이 사랑 이야기로 뒤집히는 순간이 압권이에요.",0],
   ["그리고 아무도 없었다","애거서 크리스티","외딴섬의 열 명이 동요 가사대로 한 명씩 죽습니다. 설정이 단순해 머리 아플 일이 없고, 남은 인원이 줄 때마다 저절로 페이지가 넘어가요.",0],
   ["셜록 홈즈의 모험","아서 코난 도일","단편집이라 한 편이 20~30쪽이면 끝납니다. 마음에 안 드는 편은 건너뛰어도 되니 '완독 실패'라는 좌절이 없어요.",0],
   ["다빈치 코드","댄 브라운","챕터가 몇 쪽으로 짧게 끊겨서 '한 챕터만 더' 하다 절반을 읽게 됩니다. 두께 대비 체감 속도가 가장 빠른 축에 듭니다.",0],
   ["종의 기원","정유정","살인자 시점의 한국 스릴러. 번역서 특유의 어색함이 없어 몰입이 빠르고, 하룻밤이면 충분한 분량이에요.",0]],
2:[["화차","미야베 미유키","실종된 여자를 좇다 카드빚과 신용 사회의 그늘로 이어집니다. 범인 찾기를 넘어 '왜 이런 일이 벌어졌나'를 묻는 사회파 미스터리의 대표작이에요.",0],
   ["나를 찾아줘","길리언 플린","중반에 이야기의 전제 자체가 무너집니다. 두 화자를 번갈아 배치해 독자를 의도적으로 속이는 솜씨가 정교해요.",0],
   ["셔터 아일랜드","데니스 루헤인","마지막 장을 덮고 앞부분을 다시 뒤적이게 됩니다. 복선이 처음부터 깔려 있어 재독하면 완전히 다른 이야기가 돼요.",0],
   ["13계단","다카노 가즈아키","사형수의 기억을 되짚어 무죄를 밝히려는 추적기. 국내에선 크게 알려지지 않았지만 에도가와 란포상 수상작으로, 구성의 짜임새가 뛰어납니다.",1],
   ["마당이 있는 집","김진영","평범한 주부의 일상에 균열이 생기며 서서히 조여드는 한국 스릴러. 분량이 짧고 문장이 담백해, 국내 장르소설의 수준을 확인하기 좋습니다.",1]],
3:[["백야행","히가시노 게이고","두 인물의 19년을 좇는데 정작 두 사람의 속마음은 끝까지 서술되지 않습니다. 주변 증언만으로 진실을 추론하게 만드는 구성이 탁월해요.",0],
   ["양들의 침묵","토머스 해리스","사건 해결보다 두 사람의 대화가 더 무서운 소설. 심리 묘사의 밀도가 높아 단순 추리물과는 결이 다릅니다.",0],
   ["검은 집","기시 유스케","보험금을 둘러싼 서늘한 이야기. 초자연적 장치 없이 사람만으로 공포를 만들어내는데, 일본 밖에선 덜 알려진 수작이에요.",1],
   ["제노사이드","다카노 가즈아키","생물학·국제정치·추격이 한데 얽힌 대작. 두께가 상당하지만 챕터 전환이 빨라 체감 속도가 좋고, 아는 사람만 아는 밀도를 지녔습니다.",1],
   ["밀레니엄: 여자를 증오한 남자들","스티그 라르손","가족사 미스터리와 사회 고발이 겹칩니다. 초반 정보량이 많아 진입에 인내가 필요한 대신, 넘어서면 멈추기 어려워요.",0]],
4:[["재능 있는 리플리 씨","퍼트리샤 하이스미스","범죄자에게 이입하게 만들고, 그러는 자신에게 불편해지게 만듭니다. 독자의 도덕감각을 시험하는 구조가 이 작가의 특기예요.",0],
   ["팅커, 테일러, 솔저, 스파이","존 르 카레","총격전 없이 서류와 기억, 대화만으로 배신자를 찾아냅니다. 정보가 의도적으로 조각나 있어 독자가 직접 재구성해야 해요.",0],
   ["기나긴 이별","레이먼드 챈들러","하드보일드 탐정물이면서 문장 자체가 목적인 소설. 사건보다 분위기와 대사를 즐기는 독법이 필요합니다.",0],
   ["몰타의 매","대실 해밋","인물의 속내를 일절 설명하지 않고 행동과 대사만으로 밀어붙입니다. 행간을 읽는 훈련이 된 독자에게 특히 재밌어요.",0],
   ["이니시에이션 러브","이누이 구루미","평범한 연애소설처럼 읽히다가 마지막 두 줄에서 전부 뒤집힙니다. 서술 트릭의 교과서로 꼽히지만 국내 인지도는 낮은 편이에요.",1]],
5:[["장미의 이름","움베르토 에코","중세 수도원 연쇄 죽음을 다루지만 실제로는 기호학·신학이 얽힌 지적 미로입니다. 진입 장벽이 높은 대신 장르의 한계를 보여줘요.",0],
   ["죄와 벌","표도르 도스토옙스키","범인도 동기도 초반에 드러나고, 남는 건 무너져가는 한 인간의 내면입니다. 모든 현대 심리 스릴러의 원형이에요.",0],
   ["2666","로베르토 볼라뇨","다섯 부로 나뉜 미완의 대작. 연쇄 살인이라는 축을 두고 문학·역사·폭력이 뒤엉키는데, 완독 자체가 하나의 사건이 되는 책입니다.",1],
   ["눈먼 암살자","마거릿 애트우드","소설 속 소설이 겹쳐지며 진실이 늦게 도착합니다. 부커상 수상작이지만 이 작가의 다른 책에 가려 덜 읽힌 편이에요.",1],
   ["블랙 달리아","제임스 엘로이","실제 미제 사건을 바탕으로 한 느와르. 문장이 거칠고 인물이 많아 만만치 않지만, 장르의 어두운 극한을 보여줍니다.",1]]}},

healing:{name:"마음을 데우는 사람",tag:"위로 · 힐링",accent:"#E3A24A",
 blurb:"당신에게 이야기는 손난로 같은 것이에요. 사건이 크지 않아도, 다정한 사람들이 서로를 조금씩 살려내는 이야기면 충분합니다. 읽고 나면 마음 한켠이 데워지고 오늘 하루가 조금 견딜 만해지는 감각을 아는 사람이죠.",
 blurb2:"당신이 소설에서 찾는 건 자극이 아니라 회복이에요. 그래서 같은 책을 여러 번 펼쳐도 질리지 않고, 좋아하는 장면만 다시 읽는 일도 잦습니다.",
 why:"문장이 편안하고 인물이 다정해 읽는 내내 긴장할 일이 없어요. '책은 어렵고 진지한 것'이라는 편견을 가장 부드럽게 풀어주는 결입니다.",
 why2:"장면이 짧게 끊기는 구성이 많아, 하루 10분씩 나눠 읽어도 흐름을 놓치지 않는다는 점도 큰 장점이에요.",
 books:{
1:[["불편한 편의점","김호연","편의점을 오가는 사람들의 사연이 짧은 에피소드로 이어집니다. 하루 한 챕터씩 읽기 좋고, 다 읽고 나면 확실히 마음이 따뜻해져요.",0],
   ["미드나잇 라이브러리","매트 헤이그","'그때 다른 선택을 했다면'이라는 후회를 이야기로 풀어냅니다. 챕터가 짧아 읽기 편하면서도 지금의 삶을 다시 보게 만들어요.",0],
   ["달러구트 꿈 백화점","이미예","꿈을 사고파는 가게라는 상상이 포근합니다. 갈등이 세지 않아 자기 전에 조금씩 읽기에 특히 잘 맞아요.",0],
   ["나미야 잡화점의 기적","히가시노 게이고","시간을 넘어 오가는 상담 편지들이 마지막에 하나로 이어집니다. 구성이 정교해 지루하지 않으면서 결말이 뭉클해요.",0],
   ["어서 오세요, 휴남동 서점입니다","황보름","큰 사건 없이 서점에 모인 사람들의 일상이 흐릅니다. 책과 다시 친해지고 싶은 마음 자체를 응원해주는 소설이에요.",0]],
2:[["오베라는 남자","프레드릭 배크만","까칠한 노인의 무뚝뚝함 뒤에 어떤 상실이 있었는지 서서히 드러납니다. 웃다가 갑자기 목이 메는 경험을 하게 돼요.",0],
   ["창문 넘어 도망친 100세 노인","요나스 요나손","100세 노인의 유쾌한 탈출 소동극. 위로가 꼭 눈물일 필요는 없다는 걸 보여줍니다.",0],
   ["키친","요시모토 바나나","가족을 잃은 사람이 부엌에서 회복해가는 이야기. 감정을 설명이 아니라 분위기로 전달하는 방식을 맛보기 좋아요.",0],
   ["츠바키 문구점","오가와 이토","남의 편지를 대신 써주는 대필가의 잔잔한 일상. 국내에선 조용히 읽혔지만, 사계절의 결을 따라가는 구성이 정갈합니다.",1],
   ["갈매기의 꿈","리처드 바크","아주 얇지만 오래 남는 우화. 짧은 분량에 삶의 태도를 담아내는 방식이 인상적이에요.",0]],
3:[["여름은 오래 그곳에 남아","마쓰이에 마사시","건축 사무소에서 보낸 한 여름의 기록. 사건이 거의 없는데도 계속 읽히는, 분위기의 힘이 무엇인지 알려주는 조용한 명작입니다.",1],
   ["긴긴밤","루리","코끼리와 펭귄의 이야기. 어린이책으로 분류되지만 어른이 읽으면 오히려 더 아픈, 짧고 단단한 작품이에요.",1],
   ["소년과 개","하세 세이슈","한 마리 개가 여러 사람을 거치며 이어지는 연작. 나오키상 수상작인데 국내에선 조용히 읽혔고, 감정을 억누른 문체가 오히려 깊습니다.",1],
   ["나의 라임오렌지나무","J.M. 바스콘셀로스","어린아이의 시선으로 가난과 상실을 그립니다. 읽기는 어렵지 않지만 감정의 진폭이 커요.",0],
   ["빨강 머리 앤","루시 모드 몽고메리","줄거리는 익숙해도 원작 문장을 직접 읽으면 인상이 완전히 달라집니다. 자연 묘사와 유머의 밀도가 상당해요.",0]],
4:[["스토너","존 윌리엄스","크게 성공하지도 특별히 불행하지도 않은 한 사람의 일생. 극적 사건이 없는데도 끝까지 붙드는 문장의 힘이 압도적입니다. 오랜 절판 끝에 재발견된 작품이에요.",1],
   ["밤에 우리 영혼은","켄트 하루프","두 노인이 밤마다 함께 잠드는 이야기. 문장이 극도로 절제되어 있어 감정을 독자가 직접 채워 넣게 만듭니다.",1],
   ["섬에 있는 서점","개브리엘 제빈","작은 섬 서점 주인의 삶. 책을 좋아하는 사람을 위한 장치가 곳곳에 있어, 아는 만큼 더 즐거워지는 소설이에요.",1],
   ["모모","미하엘 엔데","동화의 외형으로 시간과 자본을 정면으로 다룹니다. 해석의 층이 여러 겹이라 읽는 나이에 따라 다른 책이 돼요.",0],
   ["인생","위화","격동의 현대사를 한 농민의 삶으로 통과합니다. 문장은 쉬운데 담긴 무게가 커서 다 읽고 한동안 말을 잃게 됩니다.",0]],
5:[["침묵","엔도 슈사쿠","신앙과 배교 사이에서 흔들리는 인간을 그립니다. 위로라기엔 가혹하지만, 끝까지 읽은 사람에게만 주어지는 종류의 구원이 있어요.",0],
   ["이반 일리치의 죽음","레프 톨스토이","한 사람이 죽음을 받아들이는 과정을 정면으로 응시합니다. 아주 짧은데 남는 무게는 장편급이에요.",0],
   ["나의 아름다운 정원","심윤경","1970년대 서울, 한 가족의 이야기를 아이의 눈으로 그립니다. 문학상 수상작이지만 널리 회자되지 않은, 다시 읽힐 만한 한국 소설이에요.",1],
   ["토니오 크뢰거","토마스 만","예술가로 사는 일의 외로움을 다룬 중편. 관념적 문장이 많아 천천히 읽어야 하지만 문장 하나하나가 밑줄감입니다.",1],
   ["어린 왕자","생텍쥐페리","어릴 때 읽은 기억으로 넘기기 쉬운데, 성인이 되어 다시 읽으면 완전히 다른 책이 됩니다. 함의를 곱씹는 독자일수록 얻는 게 많아요.",0]]}},

fantasy:{name:"다른 세계의 여행자",tag:"환상 · 모험",accent:"#8574C4",
 blurb:"당신은 지금 여기가 아닌 곳으로 떠나고 싶은 사람이에요. 문 하나만 열면 마법과 용, 낯선 지도와 오래된 예언이 기다리는 세계. 그 안에서 가장 생생하게 살아납니다.",
 blurb2:"당신에게 두꺼운 책은 부담이 아니라 오히려 반가운 소식이에요. 세계가 넓을수록 오래 머무를 수 있으니까요.",
 why:"세계 자체에 빠지는 재미가 커서 한번 발을 들이면 분량이 무섭지 않습니다. 장면이 영화처럼 그려지는 장르라 문장과 씨름할 일도 적어요.",
 why2:"시리즈물이 많다는 것도 장점입니다. 1권이 재밌으면 다음 권이 이미 준비되어 있으니 독서 습관이 자연스럽게 이어져요.",
 books:{
1:[["해리 포터와 마법사의 돌","J.K. 롤링","주인공이 마법 세계를 처음 배우는 구조라 독자도 함께 익숙해집니다. 1권이 가장 짧고 가벼우니 여기서 시작하세요.",0],
   ["호빗","J.R.R. 톨킨","『반지의 제왕』의 앞 이야기지만 훨씬 짧고 명랑합니다. 여정을 따라가는 단순한 구조라 길을 잃지 않아요.",0],
   ["나니아 연대기","C.S. 루이스","옷장 너머로 넘어가는 순간의 설렘이 전부라 할 만합니다. 각 권이 짧고 독립적이라 끊어 읽기 편해요.",0],
   ["네버엔딩 스토리","미하엘 엔데","책 속으로 빨려 들어가는 소년의 이야기. 읽는다는 행위 자체를 주제로 삼아, 독서와 친해지려는 사람에게 특별하게 남습니다.",0],
   ["이상한 나라의 앨리스","루이스 캐럴","논리가 뒤틀린 세계를 그냥 즐기면 되는 책. 짧고 장면마다 독립적이라 부담이 거의 없어요.",0]],
2:[["반지의 제왕","J.R.R. 톨킨","현대 판타지의 원류. 지명과 계보가 많아 초반이 느리지만, 그 축적이 후반의 감동을 만듭니다.",0],
   ["어스시의 마법사","어슐러 K. 르 귄","마법을 화려한 볼거리가 아니라 '이름을 아는 일'로 다룹니다. 짧은데 문장이 단단해요.",0],
   ["하울의 움직이는 성","다이애나 윈 존스","애니메이션은 유명해도 원작 소설을 읽은 사람은 드뭅니다. 영화와 전개가 꽤 달라 오히려 새롭고, 유머 감각이 뛰어나요.",1],
   ["스타더스트","닐 게이먼","별을 찾아 떠나는 어른을 위한 동화. 분량이 짧아 이 작가의 결을 가볍게 시험해보기 좋습니다.",0],
   ["미스트본","브랜던 샌더슨","마법 체계가 규칙으로 명확히 설계되어, 능력의 응용을 추리하듯 따라가는 재미가 큽니다.",0]],
3:[["바람의 이름","패트릭 로스퍼스","주인공이 자기 인생을 직접 들려주는 액자 구성. 들려주는 목소리 자체가 매력적이라 두꺼운데도 잘 넘어갑니다.",0],
   ["나이트 서커스","에린 모겐스턴","밤에만 열리는 서커스를 무대로 한 환상담. 사건보다 이미지와 분위기로 승부하는, 국내에선 조용히 사랑받은 작품이에요.",1],
   ["마지막 유니콘","피터 S. 비글","영미권에서는 고전 대접을 받지만 국내 인지도는 낮습니다. 문장이 시적이고 쓸쓸해, 판타지도 문학이 될 수 있음을 보여줘요.",1],
   ["아메리칸 갓즈","닐 게이먼","이민자들이 데려온 옛 신들이 현대 미국에서 살아갑니다. 신화를 현대로 옮기는 상상력이 뛰어나요.",0],
   ["얼음과 불의 노래","조지 R.R. 마틴","시점 인물이 매 장 바뀌고 주인공이라 믿은 사람이 예고 없이 사라집니다. 방대한 인물 관계를 스스로 붙들어야 해요.",0]],
4:[["티가나","가이 가브리엘 케이","이름을 빼앗긴 나라를 되찾으려는 이야기. 국내에선 거의 언급되지 않지만 서정적 문체와 정치적 깊이로 높이 평가받는 작품입니다.",1],
   ["리틀, 빅","존 크롤리","한 가문과 요정 세계가 4대에 걸쳐 얽힙니다. 진행이 느리고 문장이 촘촘해 만만치 않지만, 판타지 문학의 숨은 정점으로 꼽혀요.",1],
   ["조너선 스트레인지와 마법사 노렐","수재나 클라크","19세기 영국 문체를 흉내 내고 각주까지 촘촘히 달린 소설. 그 형식 자체가 즐거움인 작품이에요.",0],
   ["다크 타워","스티븐 킹","서부극·판타지·SF가 뒤섞인 장편 시리즈. 장르 경계를 넘나드는 구성이라 규칙적인 판타지에 지친 독자에게 신선합니다.",0],
   ["실마릴리온","J.R.R. 톨킨","소설보다 신화집·연대기에 가깝습니다. 서사적 재미보다 세계의 뿌리를 알고 싶은 사람을 위한 책이에요.",0]],
5:[["고르멘가스트","머빈 피크","마법이 거의 없는데도 가장 기괴한 판타지로 꼽힙니다. 만연체 묘사가 끝없이 이어져 진입이 어렵지만, 문장의 밀도는 독보적이에요.",1],
   ["눈물을 마시는 새","이영도","한국 판타지의 도달점으로 꼽히는 4권 분량의 대작. 종족 설정과 철학적 대사가 촘촘해, 가볍게 읽히지 않는 대신 완독의 무게가 큽니다.",1],
   ["페르디도 스트리트 정거장","차이나 미에빌","기괴하고 이질적인 도시를 밀도 높은 문장으로 쌓아 올립니다. 익숙한 판타지 문법을 일부러 비트는 작품이에요.",0],
   ["신들의 사회","로저 젤라즈니","힌두 신화와 SF가 결합한 기묘한 작품. 설명 없이 던져지는 설정이 많아 초반 적응이 필요합니다.",1],
   ["픽션들","호르헤 루이스 보르헤스","무한한 도서관, 갈라지는 시간 같은 환상을 짧은 단편으로 응축합니다. 한 편이 몇 쪽인데 하루 종일 생각하게 돼요.",0]]}},

literary:{name:"여운을 줍는 사람",tag:"마음 · 문학",accent:"#C08AA0",
 blurb:"당신은 사건보다 '남는 것'을 아끼는 사람이에요. 무슨 일이 벌어졌는지보다 그 일을 겪은 사람의 마음이 어떻게 흔들렸는지가 궁금하고, 아름다운 문장 한 줄이 대단한 반전보다 오래 기억에 남습니다.",
 blurb2:"당신에게 좋은 소설은 다 읽고 나서 바로 다음 책으로 넘어가지 못하게 만드는 책이에요. 잠시 멍하니 있어야 하는 시간, 그게 당신이 찾는 것입니다.",
 why:"빠른 전개보다 감정의 결과 문장의 밀도를 즐기는 취향이라, 사건이 적은 소설에서도 지루함을 잘 느끼지 않아요. 오히려 여백이 많은 작품에서 더 많은 것을 읽어냅니다.",
 why2:"다만 처음부터 두껍고 난해한 고전으로 들어가면 지치기 쉬우니, 짧은 단편집이나 얇은 중편으로 감각을 먼저 익히는 편이 좋아요.",
 books:{
1:[["쇼코의 미소","최은영","단편집이라 한 편이 30쪽 안팎이면 끝납니다. 우리말 문장이 맑고 인물들의 어긋난 마음을 담담히 그려내 여운이 깊어요.",0],
   ["노르웨이의 숲","무라카미 하루키","청춘과 상실을 다루지만 문장이 감각적이고 읽기 쉬워, 순문학의 첫 장편으로 자주 권해집니다.",0],
   ["데미안","헤르만 헤세","분량이 짧고 문장이 잠언처럼 인상적이라 밑줄 긋는 재미를 처음 알기에 좋아요.",0],
   ["인간 실격","다자이 오사무","얇지만 밀도가 높습니다. 한 인간의 자기 고백을 끝까지 따라가는 형식이라 화자의 목소리에 몰입하게 돼요.",0],
   ["브람스를 좋아하세요...","프랑수아즈 사강","짧고 섬세한 연애 소설. 감정의 미세한 흔들림을 포착하는 솜씨가 뛰어나 문학의 결을 가볍게 맛보기 좋습니다.",0]],
2:[["이방인","알베르 카뮈","짧은데 충격은 큽니다. 감정을 배제한 건조한 문체 자체가 주제를 실어 나르는 방식이에요.",0],
   ["위대한 개츠비","F. 스콧 피츠제럴드","화려한 파티 뒤의 공허를 그립니다. 화자가 사건 바깥에 있다는 점이 이야기에 묘한 거리감을 만들어요.",0],
   ["노인과 바다","어니스트 헤밍웨이","아주 얇고 사건도 단순한데, 덜어낸 것들이 오히려 의미를 만듭니다. 이른바 빙산 이론을 체감하기 좋아요.",0],
   ["나는 나를 파괴할 권리가 있다","김영하","죽음을 도와주는 남자의 이야기. 아주 얇고 서늘한데, 한국 소설이 이런 형식도 시도했다는 걸 알려주는 작품입니다.",1],
   ["소년이 온다","한강","시점이 계속 바뀌며 하나의 사건을 여러 각도에서 비춥니다. 아름답지만 소재가 무거우니 마음의 준비가 필요해요.",0]],
3:[["아무도 아닌","황정은","짧은 단편들이 세상의 가장자리를 비춥니다. 문장을 극도로 줄이는 방식이라 처음엔 낯설지만, 익숙해지면 여백이 전부 말을 걸어와요.",1],
   ["파도가 바다의 일이라면","김연수","입양된 여자가 자기 뿌리를 찾아가는 이야기. 이 작가의 다른 책에 가려 덜 읽혔지만, 문장의 결이 가장 아름다운 축에 듭니다.",1],
   ["축복받은 집","줌파 라히리","인도계 이민자들의 일상을 담은 단편집. 퓰리처상 수상작인데 국내에선 조용히 읽혔고, 감정을 절제하는 솜씨가 탁월해요.",1],
   ["설국","가와바타 야스나리","줄거리를 요약하면 남는 게 없는데 읽는 동안의 감각은 선명합니다. 묘사만으로 소설이 성립함을 보여줘요.",0],
   ["그리스인 조르바","니코스 카잔차키스","삶을 대하는 두 태도가 부딪칩니다. 대사가 힘차고 사유가 깊어, 읽고 나면 태도 자체가 조금 달라져요.",0]],
4:[["아우스터리츠","W.G. 제발트","문단 구분이 거의 없고 사진이 본문에 섞여 듭니다. 기억과 역사를 다루는 방식이 독보적이라, 형식 실험에 관심 있다면 반드시 만나야 할 작가예요.",1],
   ["등대로","버지니아 울프","한 가족의 시간이 세 부분으로 갈라집니다. 사건이 거의 없고 의식의 흐름이 중심이라, 리듬을 타야 열리는 책이에요.",0],
   ["빌러비드","토니 모리슨","시간이 뒤섞이고 진실이 조각조각 드러납니다. 감정적으로도 형식적으로도 만만치 않지만 그만큼 오래 남아요.",0],
   ["눈먼 자들의 도시","주제 사라마구","따옴표도 문단 구분도 거의 없는 문체가 벽이지만, 그 답답함 자체가 작품의 상황과 겹칩니다.",0],
   ["안나 카레니나","레프 톨스토이","방대한 분량 속에 인물 심리를 정밀하게 쌓아 올립니다. 19세기 사실주의 장편이 도달한 높이를 확인할 수 있어요.",0]],
5:[["백년의 고독","가브리엘 가르시아 마르케스","한 가문의 백 년이 환상과 현실을 넘나듭니다. 비슷한 이름이 반복돼 인물 관계를 계속 붙들어야 하는 대작이에요.",0],
   ["댈러웨이 부인","버지니아 울프","단 하루를 여러 사람의 의식이 흐르는 대로 따라갑니다. 시점이 예고 없이 옮겨 다녀 리듬을 타기 전엔 혼란스러워요.",0],
   ["소리와 분노","윌리엄 포크너","1부가 지적장애인의 시점으로 시간이 뒤죽박죽 서술됩니다. 가장 악명 높은 도입부 중 하나지만, 넘어서면 구조의 설계가 보여요.",1],
   ["잃어버린 시간을 찾아서","마르셀 프루스트","한 문장이 한 쪽을 넘기기도 합니다. 완독을 목표로 삼기보다 1권부터 천천히 음미하며 접근하기를 권해요.",0],
   ["율리시스","제임스 조이스","하루를 다루는 데 장마다 문체가 통째로 바뀝니다. 주석 없이는 어렵지만, 소설 형식의 한계를 시험한 작품이에요.",0]]}},

scifi:{name:"질문을 사랑하는 사람",tag:"상상 · 사유",accent:"#57A79C",
 blurb:"당신은 '만약에?'라는 물음에 눈이 반짝이는 사람이에요. 기발한 설정 하나가 익숙한 세상을 완전히 다르게 보이게 만들 때, 이야기가 가장 짜릿하게 다가옵니다.",
 blurb2:"당신에게 소설은 감정을 겪는 일인 동시에 생각을 굴리는 일이에요. 다 읽은 뒤 누군가와 '그래서 그게 무슨 뜻일까'를 이야기하고 싶어지는 책을 좋아하죠.",
 why:"아이디어의 재미가 앞서기 때문에 인물에 깊이 이입하지 않아도 충분히 즐길 수 있어요. '생각하며 읽는' 방식이 잘 맞는 사람에게 최적의 장르입니다.",
 why2:"게다가 요즘 한국 SF는 문장이 쉽고 따뜻해서, SF를 어렵게 여겼던 사람도 부담 없이 시작할 수 있어요.",
 books:{
1:[["우리가 빛의 속도로 갈 수 없다면","김초엽","단편집이고 문장이 맑아 SF 입문으로 가장 권할 만합니다. 과학 지식이 없어도 막히지 않고 사람의 마음에 초점이 있어요.",0],
   ["프로젝트 헤일메리","앤디 위어","기억을 잃은 채 우주선에서 깨어나는 도입부부터 손을 놓기 어렵습니다. 문제를 하나씩 푸는 구조라 성취감이 있어요.",0],
   ["마션","앤디 위어","화성에 홀로 남은 사람의 생존기. 상황이 명확하고 진행이 빨라 SF가 낯설어도 바로 몰입됩니다.",0],
   ["방금 떠나온 세계","김초엽","역시 단편집이라 끊어 읽기 좋아요. 각 편이 다른 상상을 던져주니 자기 취향의 SF를 탐색하기에 알맞습니다.",0],
   ["타임머신","H.G. 웰스","백 년도 더 된 고전인데 분량이 아주 짧습니다. SF의 원형적 상상이 어디서 시작됐는지 가볍게 볼 수 있어요.",0]],
2:[["당신 인생의 이야기","테드 창","언어가 사고를 바꾼다는 발상을 이야기로 구현합니다. 짧지만 밀도가 높아 읽고 나서 한참 생각하게 돼요.",0],
   ["안드로이드는 전기양을 꿈꾸는가","필립 K. 딕","'무엇이 인간인가'를 묻는 고전. 영화 「블레이드 러너」의 원작이지만 결이 꽤 달라 비교해 읽는 재미가 있어요.",0],
   ["얼마나 닮았는가","김보영","국내 SF의 대표 작가인데 대중적 인지도는 낮은 편입니다. 로봇의 시점을 다루는 방식이 정교해, 김초엽 다음 단계로 딱 맞아요.",1],
   ["유년기의 끝","아서 C. 클라크","인류 전체의 운명을 다루는 스케일. 개별 인물보다 문명 단위로 사고하는 SF의 맛을 알려줍니다.",0],
   ["멋진 신세계","올더스 헉슬리","모두가 행복하도록 설계된 사회의 섬뜩함. 문장이 어렵지 않아 디스토피아 입문으로 좋습니다.",0]],
3:[["노래하는 새들도 지금은 사라지고","케이트 윌헬름","복제 인간으로 명맥을 잇는 공동체의 3대기. 휴고상 수상작인데 국내에선 거의 언급되지 않는, 조용하고 서늘한 걸작이에요.",1],
   ["숨","테드 창","자유의지·기억·결정론을 이야기로 풀어냅니다. 앞 단편집보다 사유의 밀도가 한 단계 높아요.",0],
   ["어둠의 왼손","어슐러 K. 르 귄","성별이 고정되지 않은 사회를 설정해 우리 사회를 되비춥니다. 사변적 SF의 대표작이에요.",0],
   ["스노 크래시","닐 스티븐슨","메타버스라는 말이 여기서 나왔습니다. 정보량이 많고 속도가 빨라, 따라가는 것 자체가 즐거움이에요.",0],
   ["화성 연대기","레이 브래드버리","연작 단편으로 이어지는 화성 이주사. 과학보다 시적인 문장이 중심이라 문학적 SF의 결을 알려줍니다.",0]],
4:[["블라인드사이트","피터 왓츠","의식이란 무엇인가를 정면으로 파고드는 하드 SF. 전문 용어가 쏟아져 진입이 어렵지만, 마니아들 사이에서 손꼽히는 작품이에요.",1],
   ["듄","프랭크 허버트","정치·종교·생태·경제가 한 행성 위에서 얽힙니다. 고유명사가 대거 쏟아져 초반이 힘들지만 넘어서면 압도적이에요.",0],
   ["삼체","류츠신","물리학 개념이 서사의 핵심 장치로 쓰이는 하드 SF. 과학적 설명을 즐길 수 있어야 진가가 보입니다.",0],
   ["뉴로맨서","윌리엄 깁슨","사이버펑크의 출발점. 설명을 생략하고 낯선 용어를 그대로 던지는 문체라 그 불친절함 자체가 감각입니다.",0],
   ["하이페리온","댄 시먼스","일곱 순례자가 각자의 이야기를 들려주는 액자 구성. 편마다 문체와 장르가 달라 형식의 실험을 즐기는 독자에게 인상적이에요.",0]],
5:[["디아스포라","그렉 이건","육체를 떠난 지성들의 이야기. 수학과 물리 개념이 서사 그 자체라, SF 독자 중에서도 완독자가 드문 극한의 작품입니다.",1],
   ["스타메이커","올라프 스테이플든","우주의 탄생부터 종말까지를 조망합니다. 인물도 대사도 거의 없는 특이한 형식인데, 후대 SF 대부분이 여기서 빚을 졌어요.",1],
   ["리보위츠를 위한 찬송","월터 M. 밀러 주니어","핵전쟁 이후 수도원이 지식을 보존하는 천 년의 연대기. 휴고상 수상작이지만 국내 인지도는 매우 낮습니다.",1],
   ["노변의 피크닉","스트루가츠키 형제","외계인이 남기고 간 구역을 둘러싼 이야기. 설명을 끝까지 거부하는 태도가 이 작품의 핵심이에요.",1],
   ["솔라리스","스타니스와프 렘","끝내 이해할 수 없는 지성 앞에서 인간이 얼마나 무력한지를 그립니다. 사건보다 철학적 사유가 중심이라 진행이 느려요.",0]]}},

realism:{name:"일상을 껴안는 사람",tag:"현실 · 공감",accent:"#C9A567",
 blurb:"당신은 '나도 그래' 하고 고개를 끄덕이게 되는 이야기를 아끼는 사람이에요. 마법도 우주도 아닌 우리 곁의 삶에서 위로와 힘을 얻습니다. 익숙한 골목과 평범한 사람들 속에서 오히려 더 큰 진실을 발견하죠.",
 blurb2:"당신에게 좋은 소설은 세상을 다시 보게 만드는 책이에요. 읽고 나면 주변 사람들이 조금 다르게 보이는, 그런 변화를 좋아합니다.",
 why:"배경도 인물도 낯설지 않아 설정을 이해하는 데 힘을 쓸 필요가 없어요. 그만큼 이야기 자체에 바로 집중할 수 있습니다.",
 why2:"특히 한국 소설이 잘 맞는 취향이에요. 번역을 거치지 않은 문장이 주는 밀착감이 공감의 폭을 한층 넓혀줍니다.",
 books:{

   ["완득이","김려령","유쾌하고 속도감 있는 성장소설. 대사가 살아 있어 웃으며 읽다가 인물들의 현실에 마음이 쓰이게 돼요.",0],

const shell=document.getElementById("shell");

function resetState(){ scores={}; ORDER.forEach(k=>scores[k]=0); picks=[]; levelScore=0; step=0; }

function esc(s){ return String(s).replace(/[&<>"]/g,c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])); }
function setAccent(h){ document.documentElement.style.setProperty("--accent",h); }
function recompute(){
  scores={}; ORDER.forEach(k=>scores[k]=0); levelScore=0;
  picks.forEach((p,i)=>{ if(p==null)return;
    if(i<TASTE_Q.length){ TASTE_Q[i].o[p][1].forEach(([k,w])=>scores[k]+=w); }
    else{ levelScore+=LEVEL_Q[i-TASTE_Q.length].o[p][1]; } });
}

/* ============ 문항 ============ */
function renderStep(){
  const isTaste=step<TASTE_Q.length;
  const data=isTaste?TASTE_Q[step]:LEVEL_Q[step-TASTE_Q.length];
  const pct=Math.round((step/total)*100);
  const phase=isTaste?`취향 · ${step+1} / ${TASTE_Q.length}`:`내공 · ${step-TASTE_Q.length+1} / ${LEVEL_Q.length}`;
  const opts=data.o.map((p,i)=>`<button class="opt" data-i="${i}" style="animation-delay:${0.05+i*0.05}s"><span>${esc(p[0])}</span></button>`).join("");
  shell.innerHTML=`<section class="card fade">
    <div class="progrow"><button class="back" id="back">${step===0?"‹ 처음":"‹ 이전"}</button><span class="count">${esc(phase)}</span></div>
    <p class="phase">${isTaste?"무엇을 좋아하나요":"얼마나 즐겨 읽나요"}</p>
    <div class="bar"><span style="width:${pct}%"></span></div>
    <h2 class="q">${esc(data.q)}</h2><div class="opts">${opts}</div></section>`;
  document.getElementById("back").onclick=()=>{ if(step===0){renderIntro();}else{step--;renderStep();} };
  shell.querySelectorAll(".opt").forEach(b=>{ b.onclick=()=>{
    picks[step]=+b.dataset.i; recompute();
    if(step+1<total){ step++; renderStep(); } else { renderResult(); } }; });
}

    <p class="mix">여기에 <b style="color:${s.accent}">${esc(s.tag)}</b>의 결도 함께 섞여 있어요. 두 결이 만나는 작품을 찾으면 만족도가 특히 높습니다.</p>
    <div class="shelf-head"><h3>당신에게 맞는 다섯 권</h3><span class="arrow"></span></div>
    <p class="tabhint">단계를 눌러 다른 난이도의 책도 둘러볼 수 있어요 (좌우로 넘겨보세요)</p>
    <div class="tabs">${tabs}</div>
    <div id="tierBox"></div>
    <div class="share"><button class="btn" id="imgBtn">결과 이미지로 공유</button></div>
    <div class="share" style="margin-top:10px">
      <button class="btn btn-ghost" id="linkBtn">링크 공유</button>
      <button class="btn btn-ghost" id="again">다시 해보기</button></div>
    <p class="note" id="shareNote">친구에게도 취향과 내공을 물어보세요</p>
    <p class="disc">추천 도서는 모두 실제 출간된 작품이며, 내공 단계는 답변으로 가늠한 대략의 안내예요. 낮은 단계가 '못 읽는다'는 뜻은 아니고 지금 가장 편히 즐길 수 있는 결을 뜻합니다. 숨은 보석 중에는 절판되었거나 국내 미번역인 책, 판본에 따라 제목이 다른 책이 섞여 있어요. 서점에서 안 보이면 <b>도서관·중고서점</b>을 찾아보세요.</p>
  </section>`;
  renderTier(win,measured);
  shell.querySelectorAll(".tab").forEach(t=>{ t.onclick=()=>{
    selectedLevel=+t.dataset.l;
    shell.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on",+x.dataset.l===selectedLevel));
    renderTier(win,measured); }; });
  document.getElementById("again").onclick=renderIntro;
  document.getElementById("linkBtn").onclick=()=>shareLink(d,measured);
  document.getElementById("imgBtn").onclick=()=>shareImage(d,s,measured);
}

function renderTier(typeKey,measured){
  const d=TYPES[typeKey],lv=selectedLevel;
  const books=d.books[lv],gate=LEVELS[lv].gate;
  const tag=lv===measured?"":` <span style="color:var(--muted);font-weight:400">(둘러보는 중)</span>`;
  const hasGem=books.some(b=>b[3]);
  const legend=hasGem?`<p class="legend"><span class="gem">숨은 보석</span> 널리 알려지진 않았지만 평가가 단단한 작품이에요.</p>`:"";
  const rows=books.map((b,i)=>{
    const [title,author,reason,gem]=b;
    const first=i===0;
    const num=first?gate:String(i+1).padStart(2,"0");
    return `<div class="book ${first?"book-gate":""}">
      <div class="book-num" ${first?`style="color:${d.accent}"`:""}>${esc(num)}</div>
      <div><p class="book-title">${esc(title)} <span class="book-author">— ${esc(author)}</span>${gem?'<span class="gem">숨은 보석</span>':''}</p>
      <p class="book-reason">${esc(reason)}</p></div></div>`;
  }).join("");
  document.getElementById("tierBox").innerHTML=
    `<p class="tiercap"><b>${measured===lv?`${lv}단계 · `:`${lv}단계 · `}${esc(LEVELS[lv].name)}</b>${tag}<br>${LEVELS[lv].cap}</p>${legend}${rows}`;
}

/* ============ 공유 (링크) ============ */
function setNote(m){ const n=document.getElementById("shareNote"); if(n)n.textContent=m; }
async function shareLink(d,measured){
  const url=location.href.split("#")[0];
  const first=d.books[measured][0][0];
  const text=`[소설 취향 테스트] 나는 '${d.name}' (${d.tag}) · 내공 ${measured}단계 ${LEVELS[measured].name}. 첫 추천은 「${first}」!`;
  try{ if(navigator.share){ await navigator.share({title:"소설 취향 테스트",text,url}); return; } }catch(e){}
  try{ await navigator.clipboard.writeText(text+" "+url); setNote("결과를 복사했어요. 붙여넣어 공유하세요 ✓"); }
  catch(e){ setNote("이 환경에서는 공유가 지원되지 않아요"); }
}

/* ============ 공유 (이미지) ============ */
function wrap(ctx,text,maxW){ const lines=[];let line="";
  for(const ch of text){ if(ch==="\n"){lines.push(line);line="";continue;}
    const t=line+ch;
    if(ctx.measureText(t).width>maxW&&line){lines.push(line);line=ch;}else{line=t;} }
  if(line)lines.push(line); return lines; }
function roundRect(c,x,y,w,h,r){ c.beginPath();c.moveTo(x+r,y);c.lineTo(x+w-r,y);c.quadraticCurveTo(x+w,y,x+w,y+r);
  c.lineTo(x+w,y+h-r);c.quadraticCurveTo(x+w,y+h,x+w-r,y+h);c.lineTo(x+r,y+h);
  c.quadraticCurveTo(x,y+h,x,y+h-r);c.lineTo(x,y+r);c.quadraticCurveTo(x,y,x+r,y);c.closePath(); }
function hexA(hex,a){ const h=hex.replace("#","");
  return `rgba(${parseInt(h.substring(0,2),16)},${parseInt(h.substring(2,4),16)},${parseInt(h.substring(4,6),16)},${a})`; }

async function buildCanvas(d,s,measured){
  const W=1080,H=1560,P=90;
  const cv=document.createElement("canvas"); cv.width=W; cv.height=H;
  const ctx=cv.getContext("2d"); const A=d.accent;
  try{ await document.fonts.load('700 72px "Gowun Batang"');
       await document.fonts.load('700 34px "Noto Sans KR"');
       await document.fonts.load('400 30px "Noto Sans KR"');
       await document.fonts.ready; }catch(e){}
  const SERIF='"Gowun Batang", serif', SANS='"Noto Sans KR", sans-serif';
  ctx.fillStyle="#181425"; ctx.fillRect(0,0,W,H);
  let g=ctx.createRadialGradient(W/2,-120,0,W/2,-120,900);
  g.addColorStop(0,"#241d38"); g.addColorStop(1,"rgba(36,29,56,0)"); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  g=ctx.createRadialGradient(W/2,H*0.34,0,W/2,H*0.34,780);
  g.addColorStop(0,hexA(A,0.20)); g.addColorStop(1,hexA(A,0)); ctx.fillStyle=g; ctx.fillRect(0,0,W,H);
  ctx.strokeStyle="#3a3150"; ctx.lineWidth=2; roundRect(ctx,40,40,W-80,H-80,40); ctx.stroke();

  let y=P+80; ctx.textAlign="left";
  ctx.font=`500 26px ${SANS}`; ctx.fillStyle=A; ctx.fillText("소 설  취 향  테 스 트",P,y); y+=62;
  ctx.font=`400 30px ${SANS}`; ctx.fillStyle="#A79CB6"; ctx.fillText(d.tag,P,y); y+=74;
  ctx.font=`700 76px ${SERIF}`; ctx.fillStyle=A;
  wrap(ctx,d.name,W-P*2).forEach(l=>{ ctx.fillText(l,P,y); y+=88; }); y+=10;

  const bt=`내공 ${measured}단계 · ${LEVELS[measured].name}`;
  ctx.font=`700 30px ${SANS}`;
  const bw=ctx.measureText(bt).width+56;
  ctx.fillStyle=hexA(A,0.15); roundRect(ctx,P,y-46,bw,64,32); ctx.fill();
  ctx.strokeStyle=hexA(A,0.5); ctx.lineWidth=2; roundRect(ctx,P,y-46,bw,64,32); ctx.stroke();
  ctx.fillStyle=A; ctx.fillText(bt,P+28,y); y+=92;

  ctx.font=`400 33px ${SANS}`; ctx.fillStyle="#F2E9D6";
  wrap(ctx,d.blurb,W-P*2).slice(0,5).forEach(l=>{ ctx.fillText(l,P,y); y+=52; }); y+=20;
  ctx.font=`400 29px ${SANS}`; ctx.fillStyle="#A79CB6";
  ctx.fillText(`여기에 ${s.tag}의 결도 섞여 있어요.`,P,y); y+=76;

  ctx.strokeStyle="#3a3150"; ctx.lineWidth=2;
  ctx.beginPath(); ctx.moveTo(P,y-30); ctx.lineTo(W-P,y-30); ctx.stroke();
  ctx.font=`700 38px ${SERIF}`; ctx.fillStyle="#F2E9D6"; ctx.fillText("추천 도서",P,y+26); y+=92;

  d.books[measured].forEach((b,i)=>{
    const [title,author,,gem]=b, first=i===0;
    if(first){ ctx.fillStyle=hexA(A,0.12); roundRect(ctx,P-18,y-46,W-P*2+36,88,18); ctx.fill();
      ctx.strokeStyle=hexA(A,0.4); ctx.lineWidth=2; roundRect(ctx,P-18,y-46,W-P*2+36,88,18); ctx.stroke(); }
    ctx.font=`700 27px ${SERIF}`; ctx.fillStyle=first?A:"#8b81a0";
    ctx.fillText(first?LEVELS[measured].gate:String(i+1).padStart(2,"0"),P,y-4);
    const tx=P+150;
    ctx.font=`700 34px ${SANS}`; ctx.fillStyle="#F2E9D6";
    let t=title, limit=W-P-tx-(gem?150:20);
    while(ctx.measureText(t).width>limit&&t.length>4){ t=t.slice(0,-1); }
    if(t!==title) t=t.slice(0,-1)+"…";
    ctx.fillText(t,tx,y-8);
    if(gem){ const gx=tx+ctx.measureText(t).width+14;
      ctx.font=`700 21px ${SANS}`; const gw=ctx.measureText("숨은 보석").width+24;
      ctx.fillStyle="rgba(122,196,180,.16)"; roundRect(ctx,gx,y-32,gw,34,17); ctx.fill();
      ctx.fillStyle="#7AC4B4"; ctx.fillText("숨은 보석",gx+12,y-8); }
    ctx.font=`400 27px ${SANS}`; ctx.fillStyle="#A79CB6"; ctx.fillText(author,tx,y+30);
    y+=first?108:96;
  });

  ctx.textAlign="center";
  ctx.font=`400 26px ${SANS}`; ctx.fillStyle="#6f647f";
  ctx.fillText("취향으로 방향을, 내공으로 깊이를",W/2,H-110);
  const host=location.hostname||"";
  if(host){ ctx.font=`500 26px ${SANS}`; ctx.fillStyle=hexA(A,0.85); ctx.fillText(host,W/2,H-66); }
  return cv;
}

async function shareImage(d,s,measured){
  const btn=document.getElementById("imgBtn"); const old=btn?btn.textContent:"";
  if(btn){ btn.textContent="이미지 만드는 중…"; btn.disabled=true; }
  try{
    const cv=await buildCanvas(d,s,measured);
    const blob=await new Promise(r=>cv.toBlob(r,"image/png"));
    if(!blob) throw new Error("no blob");
    const fname=`소설취향_${d.name}.png`;
    const file=new File([blob],fname,{type:"image/png"});
    if(navigator.canShare&&navigator.canShare({files:[file]})){
      await navigator.share({files:[file],title:"소설 취향 테스트",
        text:`나는 '${d.name}' · 내공 ${measured}단계!`});
      setNote("공유했어요 ✓"); return;
    }
    const url=URL.createObjectURL(blob);
    const a=document.createElement("a"); a.href=url; a.download=fname;
    document.body.appendChild(a); a.click(); document.body.removeChild(a);
    setTimeout(()=>URL.revokeObjectURL(url),3000);
    setNote("이미지를 저장했어요. 자유롭게 공유하세요 ✓");
  }catch(e){
    if(e&&e.name==="AbortError"){ setNote("친구에게도 취향과 내공을 물어보세요"); }
    else{ setNote("이미지를 만들지 못했어요. 링크 공유를 이용해 주세요"); }
  }finally{ if(btn){ btn.textContent=old||"결과 이미지로 공유"; btn.disabled=false; } }
}

renderIntro();
</script>
