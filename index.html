<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
<title>소설 취향 테스트 — 취향과 내공으로 찾는 나의 책</title>
<meta name="description" content="여덟 개의 기분으로 취향을, 다섯 개의 습관으로 독서 내공을 재어, 지금 당신에게 꼭 맞는 다섯 권을 권합니다." />
<meta property="og:title" content="소설 취향 테스트" />
<meta property="og:description" content="당신은 어떤 이야기에 마음이 열릴까요? 취향과 내공, 두 축으로 찾는 나의 다음 책." />
<meta property="og:type" content="website" />
<style>
@import url('https://fonts.googleapis.com/css2?family=Gowun+Batang:wght@400;700&family=Noto+Sans+KR:wght@400;500;700&display=swap');

*{ box-sizing:border-box; }
html,body{ margin:0; padding:0; }

:root{
  --bg:#181425; --card:#211c30; --edge:#332b47;
  --ink:#F2E9D6; --muted:#A79CB6; --accent:#E3A24A;
}
body{
  min-height:100vh; position:relative; overflow-x:hidden;
  background:
    radial-gradient(1200px 600px at 50% -10%, #241d38 0%, transparent 60%),
    var(--bg);
  color:var(--ink);
  font-family:'Noto Sans KR', system-ui, -apple-system, sans-serif;
  display:flex; flex-direction:column; align-items:center;
  padding:28px 18px calc(40px + env(safe-area-inset-bottom));
}
#glow{
  position:fixed; inset:0; pointer-events:none; z-index:0;
  background:radial-gradient(520px 520px at 50% 34%, color-mix(in srgb, var(--accent) 22%, transparent) 0%, transparent 70%);
  animation:breathe 7s ease-in-out infinite; transition:background .8s ease;
}
@keyframes breathe{0%,100%{opacity:.6}50%{opacity:1}}

#shell{ position:relative; z-index:1; width:100%; max-width:620px; }

.card{
  background:linear-gradient(180deg, color-mix(in srgb,var(--card) 96%, #fff 4%), var(--card));
  border:1px solid var(--edge);
  border-radius:22px;
  padding:34px 30px;
  box-shadow:0 30px 70px -30px rgba(0,0,0,.7), inset 0 1px 0 rgba(255,255,255,.03);
}

.eyebrow{
  font-size:12.5px; letter-spacing:.32em; text-transform:uppercase;
  color:var(--accent); margin:0 0 20px; font-weight:500;
}
.title{
  font-family:'Gowun Batang', serif; font-weight:700;
  font-size:clamp(30px,7.5vw,42px); line-height:1.24; margin:0 0 20px; letter-spacing:-.01em;
}
.lead{ color:var(--muted); line-height:1.78; font-size:15.5px; margin:0 0 20px; }
.chips{ display:flex; gap:8px; flex-wrap:wrap; margin:0 0 30px; }
.chip{ font-size:12.5px; color:var(--muted); border:1px solid var(--edge); border-radius:99px; padding:6px 12px; }
.chip b{ color:var(--accent); font-weight:700; }

.btn{
  appearance:none; border:none; cursor:pointer; width:100%;
  font-family:'Noto Sans KR',sans-serif; font-weight:700; font-size:16px;
  padding:16px 20px; border-radius:14px; transition:transform .15s ease, filter .2s ease;
  background:var(--accent); color:#1c1206;
}
.btn:hover{ transform:translateY(-2px); filter:brightness(1.05); }
.btn:active{ transform:translateY(0); }
.note{ text-align:center; color:var(--muted); font-size:12.5px; margin:14px 0 0; }

.progrow{ display:flex; justify-content:space-between; align-items:center; margin-bottom:6px; }
.back{ background:none; border:none; color:var(--muted); cursor:pointer; font-family:inherit; font-size:13px; padding:4px 2px; }
.back:hover{ color:var(--ink); }
.count{ font-size:13px; color:var(--muted); letter-spacing:.02em; }
.phase{ font-size:11px; letter-spacing:.18em; text-transform:uppercase; color:var(--muted); margin:0 0 12px; }
.bar{ height:4px; border-radius:99px; background:#2c2540; overflow:hidden; margin-bottom:28px; }
.bar span{ display:block; height:100%; background:linear-gradient(90deg,#E3A24A,#d98450); border-radius:99px; transition:width .45s cubic-bezier(.5,.1,.2,1); }

.q{
  font-family:'Gowun Batang', serif; font-weight:700;
  font-size:clamp(21px,4.6vw,26px); line-height:1.5; margin:0 0 24px; letter-spacing:-.01em;
}

.opts{ display:flex; flex-direction:column; gap:11px; }
.opt{
  text-align:left; cursor:pointer; width:100%;
  background:#1c1830; border:1px solid var(--edge); border-radius:14px;
  color:var(--ink); font-family:inherit; font-size:15px; line-height:1.5;
  padding:16px 18px; transition:border-color .18s, background .18s, transform .12s;
  opacity:0; animation:rise .5s ease forwards;
}
.opt:hover{ border-color:var(--accent); background:#241d38; transform:translateX(3px); }
.opt:active{ transform:translateX(0) scale(.995); }

@keyframes rise{ from{opacity:0; transform:translateY(10px)} to{opacity:1; transform:translateY(0)} }
.fade{ animation:fadecard .5s ease both; }
@keyframes fadecard{ from{opacity:0; transform:translateY(14px)} to{opacity:1; transform:translateY(0)} }

.rtop{ display:flex; align-items:center; justify-content:space-between; gap:12px; margin:0 0 4px; }
.rtag{ font-size:13px; letter-spacing:.06em; color:var(--muted); margin:0; }
.badge{
  font-size:12px; font-weight:700; white-space:nowrap;
  border-radius:99px; padding:6px 12px;
  background:color-mix(in srgb, var(--accent) 16%, transparent);
  border:1px solid color-mix(in srgb, var(--accent) 45%, transparent);
  color:var(--accent);
}
.rname{
  font-family:'Gowun Batang', serif; font-weight:700;
  font-size:clamp(30px,7.5vw,40px); line-height:1.2; margin:6px 0 20px; color:var(--accent);
}
.rblurb{ line-height:1.8; font-size:16px; margin:0 0 22px; }
.rblurb + .rblurb{ margin-top:-8px; }

.panel{ background:#1b1730; border:1px solid var(--edge); border-radius:14px; padding:17px 19px; margin:0 0 14px; }
.panel-lbl{ display:block; font-size:12px; letter-spacing:.14em; text-transform:uppercase; font-weight:700; margin-bottom:8px; color:var(--accent); }
.panel p{ margin:0 0 10px; color:var(--muted); line-height:1.72; font-size:14.5px; }
.panel p:last-child{ margin-bottom:0; }
.panel .warn{ color:#c9bcd8; }

.mix{ font-size:14.5px; color:var(--muted); margin:16px 0 30px; line-height:1.7; }
.mix b{ font-weight:700; }

.shelf-head{ display:flex; align-items:center; gap:12px; margin-bottom:14px; }
.shelf-head h3{ font-family:'Gowun Batang',serif; font-size:19px; margin:0; font-weight:700; }
.arrow{ flex:1; height:2px; border-radius:2px; opacity:.5; background:var(--accent); }

.tabs{ display:flex; gap:8px; margin:0 0 6px; }
.tab{
  flex:1; cursor:pointer; font-family:inherit; font-size:13px; font-weight:700;
  padding:10px 6px; border-radius:11px; text-align:center; line-height:1.3;
  background:#1c1830; border:1px solid var(--edge); color:var(--muted); transition:all .16s;
}
.tab small{ display:block; font-weight:500; font-size:10.5px; opacity:.8; margin-top:2px; }
.tab:hover{ color:var(--ink); }
.tab.on{ color:var(--accent); border-color:color-mix(in srgb, var(--accent) 55%, transparent); background:color-mix(in srgb, var(--accent) 12%, transparent); }
.tab .you{ font-size:9px; }

.tiercap{ font-size:13px; color:var(--muted); margin:16px 0 14px; line-height:1.7; }
.tiercap b{ color:var(--ink); font-weight:700; }

.book{ display:flex; gap:14px; padding:16px 0; border-top:1px solid var(--edge); }
.book:first-of-type{ border-top:none; }
.book-num{ font-family:'Gowun Batang',serif; font-weight:700; font-size:13px; color:var(--muted); min-width:46px; padding-top:3px; }
.book-title{ margin:0 0 5px; font-size:16px; font-weight:700; line-height:1.45; }
.book-author{ font-weight:400; color:var(--muted); font-size:14px; }
.book-reason{ margin:0; color:var(--muted); line-height:1.68; font-size:14px; }
.book-gate{
  background:color-mix(in srgb, var(--accent) 12%, transparent);
  border:1px solid color-mix(in srgb, var(--accent) 40%, transparent);
  border-radius:14px; padding:16px; margin-bottom:4px;
}
.book-gate + .book{ border-top:none; }

.share{ display:flex; gap:10px; margin:26px 0 8px; }
.share .btn{ flex:1; }
.btn-ghost{ background:transparent; color:var(--ink); border:1px solid var(--edge); font-weight:500; }
.btn-ghost:hover{ filter:none; background:#241d38; }

.disc{ font-size:11.5px; color:#7a6f8c; line-height:1.65; margin:18px 0 0; }
.foot{ position:relative; z-index:1; margin-top:26px; color:#6f647f; font-size:12px; text-align:center; }

@media (max-width:420px){ .card{ padding:28px 22px; } }
@media (prefers-reduced-motion: reduce){
  #glow{ animation:none; }
  .opt, .fade{ animation:none !important; opacity:1 !important; transform:none !important; }
  .btn:hover, .opt:hover{ transform:none; }
}
</style>
</head>
<body>
<div id="glow"></div>
<main id="shell"></main>
<footer class="foot">취향으로 방향을, 내공으로 깊이를 · 나에게 맞는 다음 책</footer>

<script>
/* ================= 내공 등급 ================= */
const LEVELS = {
  1:{ name:"첫 발을 떼는 독자", short:"첫 발", key:"입문", gate:"첫 책",
      cap:"아직 '완독의 즐거움'이 낯선 단계예요. 그러니 어려운 책보다, <b>끝까지 읽게 만드는 힘이 센 책</b>이 먼저입니다. 아래 다섯 권은 문장이 쉽고 분량이 부담스럽지 않으면서도, 다 읽고 나면 '소설 재밌네'라는 감각이 확실히 남는 작품들이에요." },
  2:{ name:"제법 읽는 독자", short:"애독가", key:"애독", gate:"권합니다",
      cap:"이야기의 맛을 이미 아는 단계예요. 이제는 재미에 더해 <b>구조나 인물의 깊이가 느껴지는 작품</b>이 어울립니다. 아래는 대중적 재미를 잃지 않으면서도, 읽고 나면 곱씹을 거리가 확실히 남는 작품들이에요." },
  3:{ name:"깊이 파고드는 독자", short:"탐험가", key:"심화",
      gate:"도전작",
      cap:"쉬운 책으로는 이미 갈증이 풀리지 않는 단계예요. 아래는 <b>문체·구조·주제 어느 하나가 확실히 까다로운</b> 작품들입니다. 술술 넘어가진 않지만, 넘어선 뒤에 남는 것이 가장 큰 책들이에요." }
};

/* ================= 취향 유형 ================= */
const TYPES = {
thriller:{ name:"밤을 새우는 추적자", tag:"스릴 · 반전", accent:"#D06A57",
  blurb:"당신을 움직이는 건 '그래서 어떻게 됐는데?'라는 물음이에요. 조여드는 긴장, 하나씩 맞춰지는 조각, 마지막의 뒤통수 한 방. 이 세 가지가 있으면 평소 책과 거리가 멀던 사람도 새벽 세 시까지 페이지를 넘기게 됩니다.",
  blurb2:"당신에게 소설은 '견디며 읽는 것'이 아니라 '멈추지 못해서 읽는 것'이에요. 그래서 오히려 독서 습관을 들이기 가장 유리한 취향이기도 합니다.",
  why:"이야기가 앞으로 굴러가는 추진력이 강한 장르라, 집중력이 흐트러질 틈이 없어요. 다음 장면이 궁금해서 저절로 손이 가니, '읽어야 하는데'라는 부담 대신 '조금만 더'라는 마음으로 완독하게 됩니다.",
  why2:"또 하나의 장점은 완독 후의 성취감이 뚜렷하다는 것. 흩어진 단서가 마지막에 하나로 모이는 쾌감은 다른 장르가 쉽게 주지 못하는 보상이에요.",
  books:{
1:[["용의자 X의 헌신","히가시노 게이고","범인을 처음부터 알려주고 시작하는데도 끝까지 긴장이 풀리지 않습니다. 문장이 짧고 명료해 읽는 속도가 붙고, 마지막 20쪽에서 사건이 '사랑 이야기'로 뒤집히는 순간이 압권이에요. 추리소설을 한 번도 안 읽어봤다면 여기서 시작하세요."],
   ["그리고 아무도 없었다","애거서 크리스티","외딴섬에 모인 열 명이 동요 가사대로 한 명씩 죽습니다. 설정이 단순해 머리 아플 일이 없고, 남은 인원이 줄어들 때마다 저절로 페이지가 넘어가요. 백 년 가까이 된 작품인데 지금 읽어도 낡은 느낌이 없습니다."],
   ["셜록 홈즈의 모험","아서 코난 도일","단편집이라 한 편이 20~30쪽이면 끝납니다. 출퇴근길에 한 편씩 끊어 읽기 좋고, 마음에 안 드는 편은 건너뛰어도 되니 '완독 실패'라는 좌절이 없어요. 부담 없이 독서 습관을 만들기에 최적입니다."],
   ["종의 기원","정유정","살인자의 시점으로 진행되는 한국 스릴러. 우리말 문장이라 번역서 특유의 어색함이 없어 몰입이 빠르고, 분량도 하룻밤이면 충분합니다. 서늘한 이야기를 견딜 수 있다면 강렬한 첫 경험이 될 거예요."],
   ["다빈치 코드","댄 브라운","챕터 하나가 몇 쪽으로 짧게 끊겨서, '한 챕터만 더' 하다 보면 어느새 절반을 읽고 있습니다. 미술과 역사 수수께끼를 푸는 재미가 섞여 있어 지루할 틈이 없어요. 두께에 비해 체감 속도가 가장 빠른 책 중 하나입니다."]],
2:[["백야행","히가시노 게이고","두 인물의 19년을 좇는 대작인데, 정작 두 사람의 속마음은 끝까지 직접 서술되지 않습니다. 주변 인물의 증언만으로 진실을 추론하게 만드는 구성이 탁월해요. 두께가 상당하지만 그만큼 다 읽었을 때의 여운이 깊습니다."],
   ["나를 찾아줘","길리언 플린","아내가 사라지고 남편이 용의자가 되는데, 중반에 이야기의 전제 자체가 무너집니다. 서로 다른 두 화자를 번갈아 배치해 독자를 의도적으로 속이는 솜씨가 정교해요. '믿을 수 없는 화자'라는 기법을 처음 체감하기 좋은 작품입니다."],
   ["양들의 침묵","토머스 해리스","사건 해결보다 두 사람의 대화가 더 무서운 소설입니다. 심리 묘사의 밀도가 높아 단순 추리물과는 결이 다르고, 인물의 내면을 따라가는 독서에 익숙해질 무렵 읽으면 진가가 보여요."],
   ["화차","미야베 미유키","한 여자의 실종을 추적하다 카드빚과 신용 사회의 그늘로 이어집니다. 범인 찾기를 넘어 '왜 이런 일이 벌어졌나'를 묻는 사회파 미스터리의 대표작이에요. 재미와 문제의식을 동시에 원한다면 잘 맞습니다."],
   ["셔터 아일랜드","데니스 루헤인","마지막 장을 덮은 뒤 앞부분을 다시 뒤적이게 되는 소설입니다. 복선이 처음부터 촘촘히 깔려 있어, 재독할 때 완전히 다른 이야기로 읽혀요. 반전 소설을 여러 편 읽어 웬만해선 안 속는 사람에게 권합니다."]],
3:[["장미의 이름","움베르토 에코","중세 수도원 연쇄 죽음을 다루지만, 실제로는 기호학·신학·서양 지성사가 얽힌 지적 미로입니다. 라틴어 인용과 신학 논쟁이 그대로 나와 진입 장벽이 높은 대신, 추리 장르가 어디까지 밀도를 가질 수 있는지 보여줍니다."],
   ["죄와 벌","표도르 도스토옙스키","범인도 동기도 초반에 드러나고, 남는 것은 살인 이후 무너져가는 한 인간의 내면입니다. 심리 추적이라는 면에서 모든 현대 스릴러의 원형이에요. 긴 독백을 견딜 체력이 필요하지만, 그 대가는 확실합니다."],
   ["팅커, 테일러, 솔저, 스파이","존 르 카레","총격전 없이 서류와 기억, 대화만으로 조직 내부의 배신자를 찾아냅니다. 정보가 의도적으로 조각나 있어 독자가 직접 재구성해야 하는, 인내심을 요구하는 첩보소설이에요. 다 맞춰졌을 때의 서늘함이 대단합니다."],
   ["재능 있는 리플리 씨","퍼트리샤 하이스미스","범죄자에게 감정을 이입하게 만들고, 그러는 자기 자신에게 불편해지게 만드는 소설입니다. 도덕적으로 독자를 시험하는 구조가 이 작가의 특기예요."],
   ["몰타의 매","대실 해밋","하드보일드 탐정물의 원형. 인물의 속내를 일절 설명하지 않고 행동과 대사만으로 밀어붙이는 문체라, 행간을 읽어내는 훈련이 된 독자에게 특히 재밌습니다."]]}},

healing:{ name:"마음을 데우는 사람", tag:"위로 · 힐링", accent:"#E3A24A",
  blurb:"당신에게 이야기는 손난로 같은 것이에요. 사건이 크지 않아도, 다정한 사람들이 서로를 조금씩 살려내는 이야기면 충분합니다. 읽고 나면 마음 한켠이 데워지고, 오늘 하루가 조금 견딜 만해지는 감각을 아는 사람이죠.",
  blurb2:"당신이 소설에서 찾는 건 자극이 아니라 회복이에요. 그래서 같은 책을 여러 번 펼쳐도 질리지 않고, 좋아하는 장면만 다시 읽는 일도 잦습니다.",
  why:"문장이 편안하고 인물이 다정해서, 읽는 내내 긴장할 일이 없어요. '책은 어렵고 진지한 것'이라는 편견을 가장 부드럽게 풀어주는 결이라, 독서와 멀어졌던 사람도 다시 붙잡기 쉽습니다.",
  why2:"대체로 장면이 짧게 끊기는 구성이 많아, 하루 10분씩 나눠 읽어도 흐름을 놓치지 않는다는 점도 큰 장점이에요.",
  books:{
1:[["불편한 편의점","김호연","편의점을 오가는 사람들의 사연이 짧은 에피소드로 이어집니다. 문장이 쉽고 한 편이 금방 끝나서 하루 한 챕터씩 읽기 좋아요. 우리말 소설이라 배경도 익숙하고, 다 읽고 나면 확실히 마음이 따뜻해집니다."],
   ["미드나잇 라이브러리","매트 헤이그","'그때 다른 선택을 했다면'이라는 후회를 이야기로 풀어냅니다. 설정이 간단하고 챕터가 짧아 읽기 편하면서도, 지금의 삶을 다시 보게 만드는 위로가 담겨 있어요."],
   ["달러구트 꿈 백화점","이미예","꿈을 사고파는 가게라는 상상이 포근하게 펼쳐집니다. 갈등이 세지 않아 편하게 읽히고, 판타지가 낯선 사람에게도 부담이 없어요. 자기 전에 조금씩 읽기에 특히 잘 맞습니다."],
   ["나미야 잡화점의 기적","히가시노 게이고","시간을 넘어 오가는 고민 상담 편지들이 마지막에 하나로 이어집니다. 추리 작가답게 구성이 정교해 지루하지 않으면서도 결말이 뭉클해요. 위로와 완독의 쾌감을 같이 주는 책입니다."],
   ["어서 오세요, 휴남동 서점입니다","황보름","큰 사건 없이 서점에 모인 사람들의 일상이 흐릅니다. 잔잔한 이야기를 좋아한다면 더없이 편안하고, 책과 다시 친해지고 싶은 마음 자체를 응원해주는 소설이에요."]],
2:[["오베라는 남자","프레드릭 배크만","까칠한 노인의 무뚝뚝함 뒤에 어떤 상실이 있었는지 서서히 드러납니다. 유머와 슬픔의 배합이 절묘해, 웃다가 갑자기 목이 메는 경험을 하게 돼요. 인물 하나를 깊이 따라가는 독서의 재미를 알려줍니다."],
   ["키친","요시모토 바나나","가족을 잃은 사람이 부엌이라는 공간에서 회복해가는 이야기. 짧지만 문장의 밀도가 높아, 감정을 '설명'이 아니라 '분위기'로 전달하는 방식을 처음 맛보기 좋아요."],
   ["창문 넘어 도망친 100세 노인","요나스 요나손","100세 노인이 요양원을 탈출하며 벌어지는 유쾌한 소동극. 위로가 꼭 눈물일 필요는 없다는 걸 보여주는 책이라, 무거운 이야기에 지쳤을 때 특히 좋습니다."],
   ["여름은 오래 그곳에 남아","마쓰이에 마사시","건축 사무소에서 보낸 한 여름의 기록. 사건이라 할 만한 게 거의 없는데도 계속 읽히는, 분위기의 힘이 무엇인지 알려주는 소설이에요. 천천히 읽는 즐거움에 익숙해질 무렵 권합니다."],
   ["갈매기의 꿈","리처드 바크","아주 얇지만 오래 남는 우화. 짧은 분량에 삶의 태도를 담아내는 방식이 인상적이라, 부담 없이 한 단계 깊은 독서를 시도하기에 알맞습니다."]],
3:[["모모","미하엘 엔데","동화의 외형을 하고 있지만 시간과 자본, 삶의 속도를 정면으로 다룹니다. 쉽게 읽히면서 해석의 층이 여러 겹이라, 읽는 나이에 따라 완전히 다른 이야기가 되는 책이에요."],
   ["스토너","존 윌리엄스","크게 성공하지도, 특별히 불행하지도 않은 한 사람의 일생을 담담히 따라갑니다. 극적인 사건이 거의 없어 지루할 법한데도 끝까지 붙드는 문장의 힘이 압도적이에요. 소설이 왜 필요한가에 대한 하나의 답 같은 책입니다."],
   ["인생","위화","격동의 현대사를 한 농민의 삶으로 통과합니다. 문장은 쉬운데 담긴 무게가 상당해서, 다 읽고 한동안 아무 말도 못 하게 되는 종류의 위로예요."],
   ["나의 라임오렌지나무","J.M. 바스콘셀로스","어린아이의 시선으로 가난과 상실을 그립니다. 읽기 자체는 어렵지 않지만 감정의 진폭이 커서, 마음의 여유가 있을 때 펼치기를 권합니다."],
   ["어린 왕자","생텍쥐페리","어릴 때 읽은 기억으로 넘기기 쉬운데, 성인이 되어 다시 읽으면 완전히 다른 책이 됩니다. 짧은 문장 뒤의 함의를 곱씹는 독서에 익숙한 사람일수록 얻는 게 많아요."]]}},

fantasy:{ name:"다른 세계의 여행자", tag:"환상 · 모험", accent:"#8574C4",
  blurb:"당신은 지금 여기가 아닌 곳으로 떠나고 싶은 사람이에요. 문 하나만 열면 마법과 용, 낯선 지도와 오래된 예언이 기다리는 세계. 그 안에서 가장 생생하게 살아납니다.",
  blurb2:"당신에게 두꺼운 책은 부담이 아니라 오히려 반가운 소식이에요. 세계가 넓을수록 오래 머무를 수 있으니까요.",
  why:"세계 자체에 빠지는 재미가 크기 때문에, 한번 발을 들이면 분량이 무섭지 않습니다. 장면이 영화처럼 그려지는 장르라 문장을 붙들고 씨름할 일도 적어요.",
  why2:"시리즈물이 많다는 것도 장점입니다. 1권이 재밌으면 다음 권이 이미 준비되어 있으니, 독서 습관이 자연스럽게 이어져요.",
  books:{
1:[["해리 포터와 마법사의 돌","J.K. 롤링","판타지 입문에 이보다 좋은 관문은 드뭅니다. 주인공이 마법 세계를 처음 배우는 구조라 독자도 함께 익숙해지고, 문장이 쉬워 속도가 붙어요. 1권이 가장 짧고 가벼우니 여기서 시작하세요."],
   ["호빗","J.R.R. 톨킨","『반지의 제왕』의 앞 이야기지만 훨씬 짧고 명랑합니다. 여정을 따라가는 단순한 구조라 길을 잃지 않고, 톨킨의 세계에 발만 담가보기에 딱 좋아요."],
   ["나니아 연대기","C.S. 루이스","옷장 너머로 넘어가는 순간의 설렘이 이 시리즈의 전부라 할 만합니다. 각 권이 짧고 독립적이라 한 권씩 끊어 읽기 편해요."],
   ["네버엔딩 스토리","미하엘 엔데","책 속으로 빨려 들어가는 소년의 이야기. '읽는다는 행위' 자체를 주제로 삼은 작품이라, 독서와 친해지려는 사람에게 특별한 의미로 남습니다."],
   ["이상한 나라의 앨리스","루이스 캐럴","논리가 뒤틀린 세계를 그냥 즐기면 되는 책. 분량이 짧고 장면마다 독립적이라 부담이 거의 없고, 상상력의 결이 자기와 맞는지 가늠해보기 좋아요."]],
2:[["반지의 제왕","J.R.R. 톨킨","현대 판타지의 원류. 지명과 계보가 많아 초반이 다소 느리지만, 그 축적이 후반의 감동을 만듭니다. 세계에 오래 머무는 독서의 진수를 경험하게 돼요."],
   ["어스시의 마법사","어슐러 K. 르 귄","마법을 화려한 볼거리가 아니라 '이름을 아는 일'로 다룹니다. 분량은 짧은데 문장이 단단해서, 판타지도 문학이 될 수 있음을 보여주는 작품이에요."],
   ["바람의 이름","패트릭 로스퍼스","주인공이 자기 인생을 직접 들려주는 액자 구성. 이야기를 들려주는 목소리 자체가 매력적이라, 두꺼운데도 술술 넘어갑니다."],
   ["미스트본","브랜던 샌더슨","마법 체계가 규칙으로 명확히 설계되어 있어, 능력의 응용을 추리하듯 따라가는 재미가 큽니다. 설정을 파고드는 걸 좋아한다면 특히 잘 맞아요."],
   ["아메리칸 갓즈","닐 게이먼","이민자들이 데려온 옛 신들이 현대 미국에서 살아갑니다. 신화를 현대로 옮기는 상상력이 뛰어나고, 문학적 결도 함께 갖춘 작품이에요."]],
3:[["얼음과 불의 노래","조지 R.R. 마틴","시점 인물이 매 장 바뀌고, 주인공이라 믿은 사람이 예고 없이 사라집니다. 방대한 인물 관계를 스스로 붙들고 가야 하는, 독자의 체력을 요구하는 대작이에요."],
   ["조너선 스트레인지와 마법사 노렐","수재나 클라크","19세기 영국 문체를 그대로 흉내 내고 각주까지 촘촘히 달린 소설. 진행이 느리고 문장이 고풍스러워 진입이 쉽지 않지만, 그 형식 자체가 즐거움인 작품입니다."],
   ["페르디도 스트리트 정거장","차이나 미에빌","기괴하고 이질적인 도시를 밀도 높은 문장으로 쌓아 올립니다. 익숙한 판타지 문법을 일부러 비트는 작품이라, 여러 편을 읽어 식상함을 느끼는 독자에게 권합니다."],
   ["실마릴리온","J.R.R. 톨킨","소설이라기보다 신화집·연대기에 가깝습니다. 서사적 재미보다 세계의 뿌리를 알고 싶은 사람을 위한 책이에요."],
   ["다크 타워","스티븐 킹","서부극·판타지·SF가 뒤섞인 장편 시리즈. 장르 경계를 넘나드는 구성이라, 규칙적인 판타지에 지친 독자에게 신선합니다."]]}},

literary:{ name:"여운을 줍는 사람", tag:"마음 · 문학", accent:"#C08AA0",
  blurb:"당신은 사건보다 '남는 것'을 아끼는 사람이에요. 무슨 일이 벌어졌는지보다 그 일을 겪은 사람의 마음이 어떻게 흔들렸는지가 궁금하고, 아름다운 문장 한 줄이 대단한 반전보다 오래 기억에 남습니다.",
  blurb2:"당신에게 좋은 소설은 다 읽고 나서 바로 다음 책으로 넘어가지 못하게 만드는 책이에요. 잠시 멍하니 있어야 하는 시간, 그게 당신이 찾는 것입니다.",
  why:"빠른 전개보다 감정의 결과 문장의 밀도를 즐기는 취향이라, 사건이 적은 소설에서도 지루함을 잘 느끼지 않아요. 오히려 여백이 많은 작품에서 더 많은 것을 읽어냅니다.",
  why2:"다만 처음부터 두껍고 난해한 고전으로 들어가면 지치기 쉬우니, 짧은 단편집이나 얇은 중편으로 감각을 먼저 익히는 편이 좋아요.",
  books:{
1:[["쇼코의 미소","최은영","단편집이라 한 편이 30쪽 안팎이면 끝납니다. 우리말 문장이 맑고, 인물들의 어긋난 마음을 담담히 그려내 여운이 깊어요. 문학이 어렵다는 인상을 가장 부드럽게 깨주는 책입니다."],
   ["노르웨이의 숲","무라카미 하루키","청춘과 상실을 다루지만 문장이 감각적이고 읽기 쉬워, 순문학의 첫 장편으로 자주 권해집니다. 분위기에 젖어 읽는 독서가 무엇인지 알게 돼요."],
   ["데미안","헤르만 헤세","자기 자신을 찾아가는 성장의 이야기. 분량이 짧고 문장이 잠언처럼 인상적이라, 밑줄 긋는 재미를 처음 알기에 좋습니다."],
   ["인간 실격","다자이 오사무","얇지만 밀도가 높습니다. 한 인간의 자기 고백을 끝까지 따라가는 형식이라, 화자의 목소리에 몰입하는 독서를 경험하게 돼요."],
   ["브람스를 좋아하세요...","프랑수아즈 사강","짧고 섬세한 연애 소설. 사건은 단순한데 감정의 미세한 흔들림을 포착하는 솜씨가 뛰어나, 문학의 결을 가볍게 맛보기에 알맞습니다."]],
2:[["이방인","알베르 카뮈","짧은데 충격은 큽니다. 감정을 배제한 건조한 문체 자체가 주제를 실어 나르는 방식이라, '어떻게 쓰였는가'를 처음 의식하게 만드는 작품이에요."],
   ["위대한 개츠비","F. 스콧 피츠제럴드","화려한 파티 뒤의 공허를 그립니다. 문장이 아름다워 자주 인용되고, 화자가 사건 바깥에 있다는 점이 이야기에 묘한 거리감을 만들어요."],
   ["설국","가와바타 야스나리","줄거리를 요약하면 거의 남는 게 없는데, 읽는 동안의 감각은 선명합니다. 묘사만으로 소설이 성립할 수 있음을 보여주는 작품이에요."],
   ["소년이 온다","한강","2024년 노벨문학상 수상 작가의 대표작. 시점이 계속 바뀌며 하나의 사건을 여러 각도에서 비춥니다. 아름답지만 다루는 소재가 무거우니 마음의 준비가 필요해요."],
   ["노인과 바다","어니스트 헤밍웨이","아주 얇고 사건도 단순한데, 문장에서 덜어낸 것들이 오히려 의미를 만듭니다. 이른바 '빙산 이론'을 체감하기 가장 좋은 텍스트예요."]],
3:[["백년의 고독","가브리엘 가르시아 마르케스","한 가문의 백 년이 환상과 현실을 넘나들며 펼쳐집니다. 비슷한 이름이 반복되어 인물 관계를 계속 붙들어야 하는, 집중을 요구하는 대작이에요."],

       ["“그가 떠난 겨울, 나는 처음으로 눈의 무게를 알았다.”",[["literary",2]]],
       ["“인류가 잠을 잊은 지, 올해로 삼백 년이 되었다.”",[["scifi",2]]],
       ["“엄마는 오늘도 내 도시락 위에 미안하다고 적었다.”",[["realism",2]]]] }
];

/* ================= 내공 문항 ================= */
const LEVEL_Q = [
  { q:"최근 1년, 소설을 얼마나 읽었나요?",
    o:[["거의 안 읽었어요",0],["한두 권쯤",1],["대여섯 권은 넘게",2],["늘 곁에 두고 읽어요",3]] },
  { q:"지금까지 '끝까지' 읽어낸 책에 가장 가까운 건?",
    o:[["완독한 소설이 거의 없어요",0],["화제의 베스트셀러 정도",1],["고전이나 문학상 수상작도",2],["실험적이거나 난해한 작품까지",3]] },
  { q:"500쪽 넘는 두꺼운 책을 보면?",
    o:[["엄두가 안 나요",0],["재밌다면 도전해볼래요",1],["오히려 두꺼울수록 반가워요",2]] },
  { q:"낯선 형식(만연체, 뒤섞인 시점, 실험적 구성)을 만나면?",
    o:[["읽기 버거워요",0],["조금 헷갈려도 따라가요",1],["견딜 만해요",2],["오히려 흥미로워요",3]] },
  { q:"한 권을 다 읽고 나면, 나는?",
    o:[["'재밌었다'로 충분해요",0],["줄거리를 곱씹어요",1],["주제나 상징을 생각해요",2],["평론·해설을 찾아 읽어요",3]] }
];

/* ================= 상태 ================= */
const shell = document.getElementById("shell");
const total = TASTE_Q.length + LEVEL_Q.length;
let step=0, scores={}, picks=[], levelScore=0, selectedLevel=1;
function resetState(){ scores={}; ORDER.forEach(k=>scores[k]=0); picks=[]; levelScore=0; step=0; }
resetState();

function esc(s){ return String(s).replace(/[&<>"]/g,c=>({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c])); }
function setAccent(hex){ document.documentElement.style.setProperty("--accent", hex); }
function levelFromScore(v){ return v<=4 ? 1 : (v<=9 ? 2 : 3); }

/* 점수 전체 재계산 — '이전' 버튼으로 되돌아가도 중복 합산되지 않음 */
function recompute(){
  scores={}; ORDER.forEach(k=>scores[k]=0); levelScore=0;
  picks.forEach((pick,i)=>{
    if(pick==null) return;
    if(i < TASTE_Q.length){ TASTE_Q[i].o[pick][1].forEach(([k,w])=> scores[k]+=w); }
    else{ levelScore += LEVEL_Q[i-TASTE_Q.length].o[pick][1]; }
  });
}

/* ================= 인트로 ================= */
function renderIntro(){
  setAccent("#E3A24A"); resetState();
  shell.innerHTML = `
    <section class="card fade">
      <p class="eyebrow">소설 취향 테스트</p>
      <h1 class="title">당신은<br>어떤 이야기에<br>마음이 열릴까요?</h1>
      <p class="lead">두 가지를 함께 살펴봐요. 무엇을 좋아하는지(취향), 그리고 얼마나 즐겨 읽는지(내공). 그래야 너무 쉽지도, 너무 버겁지도 않은 딱 맞는 책을 만날 수 있어요.</p>
      <p class="lead">결과로는 <b style="color:var(--accent)">당신의 등급에 맞춘 다섯 권</b>을, 왜 그 책인지까지 함께 알려드립니다.</p>
      <div class="chips">
        <span class="chip"><b>취향</b> 8문항</span>
        <span class="chip"><b>내공</b> 5문항</span>
        <span class="chip">약 2분</span>
      </div>
      <button class="btn" id="start">첫 장을 펼치기</button>
      <p class="note">정답은 없어요 · 솔직하게 고르면 돼요</p>
    </section>`;
  document.getElementById("start").onclick = ()=>{ step=0; renderStep(); };
}

/* ================= 문항 ================= */
function renderStep(){
  const isTaste = step < TASTE_Q.length;
  const data = isTaste ? TASTE_Q[step] : LEVEL_Q[step-TASTE_Q.length];
  const pct = Math.round((step/total)*100);
  const phase = isTaste
    ? `취향 · ${step+1} / ${TASTE_Q.length}`
    : `내공 · ${step-TASTE_Q.length+1} / ${LEVEL_Q.length}`;
  const opts = data.o.map((p,i)=>
    `<button class="opt" data-i="${i}" style="animation-delay:${0.05+i*0.05}s"><span>${esc(p[0])}</span></button>`).join("");

  shell.innerHTML = `
    <section class="card fade">
      <div class="progrow">
        <button class="back" id="back">${step===0?"‹ 처음":"‹ 이전"}</button>
        <span class="count">${esc(phase)}</span>
      </div>
      <p class="phase">${isTaste?"무엇을 좋아하나요":"얼마나 즐겨 읽나요"}</p>
      <div class="bar"><span style="width:${pct}%"></span></div>
      <h2 class="q">${esc(data.q)}</h2>
      <div class="opts">${opts}</div>
    </section>`;

  document.getElementById("back").onclick = ()=>{
    if(step===0){ renderIntro(); } else { step--; renderStep(); }
  };
  shell.querySelectorAll(".opt").forEach(btn=>{
    btn.onclick = ()=>{
      picks[step] = +btn.dataset.i;
      recompute();
      if(step+1 < total){ step++; renderStep(); } else { renderResult(); }
    };
  });
}

/* ================= 결과 ================= */
function renderResult(){
  const ranked=[...ORDER].sort((a,b)=>scores[b]-scores[a]);
  const win=ranked[0], second=ranked[1];
  const d=TYPES[win], s=TYPES[second];
  const measured=levelFromScore(levelScore);
  selectedLevel=measured;
  setAccent(d.accent);

  const tabs=[1,2,3].map(l=>{
    const on=l===selectedLevel?" on":"";
    const you=l===measured?` <span class="you">· 나의 등급</span>`:"";
    return `<button class="tab${on}" data-l="${l}">${esc(LEVELS[l].short)}${you}<small>${esc(LEVELS[l].key)}</small></button>`;
  }).join("");

  shell.innerHTML = `
    <section class="card fade">
      <div class="rtop">
        <p class="rtag">${esc(d.tag)}</p>
        <span class="badge">내공 · ${esc(LEVELS[measured].name)}</span>
      </div>
      <h1 class="rname">${esc(d.name)}</h1>
      <p class="rblurb">${esc(d.blurb)}</p>
      <p class="rblurb">${esc(d.blurb2)}</p>

      <div class="panel">
        <span class="panel-lbl">이 취향이 잘 맞는 이유</span>
        <p>${esc(d.why)}</p>
        <p>${esc(d.why2)}</p>
      </div>

      <p class="mix">여기에 <b style="color:${s.accent}">${esc(s.tag)}</b>의 결도 함께 섞여 있어요. 두 결이 만나는 작품을 찾으면 만족도가 특히 높습니다.</p>

      <div class="shelf-head"><h3>당신에게 맞는 다섯 권</h3><span class="arrow"></span></div>
      <div class="tabs">${tabs}</div>
      <div id="tierBox"></div>

      <div class="share">
        <button class="btn" id="shareBtn">결과 공유하기</button>
        <button class="btn btn-ghost" id="again">다시 해보기</button>
      </div>
      <p class="note" id="shareNote">친구에게도 취향과 내공을 물어보세요</p>
      <p class="disc">추천 도서는 모두 실제 출간작이며, 내공 등급은 답변으로 가늠한 대략의 안내예요. 낮은 등급이 '못 읽는다'는 뜻은 아니고, 지금 가장 편히 즐길 수 있는 결을 뜻합니다. 위 탭으로 다른 등급의 책도 둘러보세요.</p>
    </section>`;

  renderTier(win, measured);
  shell.querySelectorAll(".tab").forEach(t=>{
    t.onclick=()=>{
      selectedLevel=+t.dataset.l;
      shell.querySelectorAll(".tab").forEach(x=>x.classList.toggle("on", +x.dataset.l===selectedLevel));
      renderTier(win, measured);
    };
  });
  document.getElementById("again").onclick=renderIntro;
  document.getElementById("shareBtn").onclick=()=>shareResult(d, measured);
}

function renderTier(typeKey, measured){
  const d=TYPES[typeKey], lv=selectedLevel;
  const books=d.books[lv], gate=LEVELS[lv].gate;
  const tag = lv===measured ? "" : ` <span style="color:var(--muted);font-weight:400">(둘러보는 중)</span>`;
  const rows=books.map((b,i)=>{
    const [title,author,reason]=b;
    const isGate=i===0;
    const num=isGate?gate:String(i+1).padStart(2,"0");
    return `<div class="book ${isGate?"book-gate":""}">
      <div class="book-num" ${isGate?`style="color:${d.accent}"`:""}>${esc(num)}</div>
      <div>
        <p class="book-title">${esc(title)} <span class="book-author">— ${esc(author)}</span></p>
        <p class="book-reason">${esc(reason)}</p>
      </div></div>`;
  }).join("");
  document.getElementById("tierBox").innerHTML =
    `<p class="tiercap"><b>${esc(LEVELS[lv].name)}</b>${tag}<br>${LEVELS[lv].cap}</p>${rows}`;
}

/* ================= 공유 ================= */
async function shareResult(d, measured){
  const url=location.href.split("#")[0];
  const first=d.books[measured][0][0];
  const text=`[소설 취향 테스트] 나는 '${d.name}' (${d.tag}) · 내공 ${LEVELS[measured].name}. 첫 책 추천은 「${first}」!`;
  try{ if(navigator.share){ await navigator.share({title:"소설 취향 테스트", text, url}); return; } }catch(e){}
  try{
    await navigator.clipboard.writeText(text+" "+url);
    const n=document.getElementById("shareNote"); if(n) n.textContent="결과를 복사했어요. 붙여넣어 공유하세요 ✓";
  }catch(e){
    const n=document.getElementById("shareNote"); if(n) n.textContent="이 환경에서는 공유가 지원되지 않아요";
  }
}

renderIntro();
</script>
</body>
</html>
